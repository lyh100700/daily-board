<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캘비</title>

<!-- 폰 홈화면에 앱처럼 설치되기 위한 설정 -->
<meta name="description" content="달력에서 날짜를 고르면 그 날의 일정을 바로 쓰고 고치는 개인용 캘린더">
<meta name="theme-color" content="#FFF6DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231E17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캘비">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">

<style>
/* ─────────────────────────────────────────────
   0. 글꼴 — Nunito (SIL Open Font License)
      끝이 둥근 글꼴이라 캐릭터의 둥근 형태와 결이 맞는다.
      숫자와 알파벳에만 쓰이고, 한글은 시스템 글꼴로 넘어간다.
      (한글 웹폰트는 수 MB라 앱에 심을 수 없다)
   ───────────────────────────────────────────── */
@font-face {
  font-family: "Nunito";
  font-style: normal;
  font-weight: 400 900;
  font-display: swap;
  src: url("fonts/nunito-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2013-2014,
                 U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A,
                 U+2044, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ─────────────────────────────────────────────
   1. 디자인 토큰 — 색과 간격을 여기서만 정한다.
      색이 질리면 이 30줄만 고치면 앱 전체가 바뀐다.
   ───────────────────────────────────────────── */
:root {
  --bg:          #FFF6DE;   /* 버터 옐로 바탕 */
  --surface:     #FFFFFF;
  --surface-2:   #FFFBF0;
  --line:        #F0E4C4;
  --ink:         #3B322A;   /* 검정 대신 따뜻한 갈색 */
  --ink-2:       #7A6A57;
  --muted:       #B0A088;
  --accent:      #FFD400;   /* 포인트 노랑 */
  --accent-ink:  #3B322A;
  --accent-soft: #FFF0B8;
  --danger:      #E07A6B;
  --sun:         #E0736A;
  --sat:         #6E9BD1;

  --shadow-sm: 0 1px 2px rgba(90,70,30,.06);
  --shadow-md: 0 2px 4px rgba(90,70,30,.05), 0 10px 26px rgba(90,70,30,.09);
  --shadow-lg: 0 4px 10px rgba(90,70,30,.10), 0 20px 46px rgba(90,70,30,.18);

  /* 간격은 4의 배수만 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  /* 둥글둥글하게 — 이 앱의 성격이다 */
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:32px; --r-full:999px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#231E17; --surface:#2E2820; --surface-2:#352E25; --line:#453C2E;
    --ink:#F6F0E2; --ink-2:#C3B49C; --muted:#8E7F66;
    --accent:#FFD84D; --accent-ink:#241F17; --accent-soft:#3E3520;
    --danger:#EE9384; --sun:#EE8E85; --sat:#8FB6E4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 2px 4px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.38);
    --shadow-lg: 0 4px 10px rgba(0,0,0,.4), 0 20px 46px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:#231E17; --surface:#2E2820; --surface-2:#352E25; --line:#453C2E;
  --ink:#F6F0E2; --ink-2:#C3B49C; --muted:#8E7F66;
  --accent:#FFD84D; --accent-ink:#241F17; --accent-soft:#3E3520;
  --danger:#EE9384; --sun:#EE8E85; --sat:#8FB6E4;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-md: 0 2px 4px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.38);
  --shadow-lg: 0 4px 10px rgba(0,0,0,.4), 0 20px 46px rgba(0,0,0,.5);
}

/* ─────────────────────────────────────────────
   2. 기본
   ───────────────────────────────────────────── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  /* Nunito를 앞에 두면 숫자·알파벳만 가져가고 한글은 자동으로 뒤로 넘어간다 */
  font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }

:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100svh;
  background: var(--bg);
  padding-bottom: calc(var(--s10) + env(safe-area-inset-bottom));
}
@media (min-width: 560px) { .app { box-shadow: var(--shadow-md); } }

/* ─────────────────────────────────────────────
   3. 월 헤더
   ───────────────────────────────────────────── */
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  /* 홈화면 앱으로 열면 상단바가 겹치므로 그만큼 밀어준다 */
  padding: calc(var(--s6) + env(safe-area-inset-top)) var(--s5) var(--s4);
  gap: var(--s3);
}

.title { display: flex; align-items: center; gap: var(--s3); }
.title-text { display: flex; align-items: baseline; gap: var(--s2); }

/* 앱의 얼굴 — 홈화면 아이콘과 같은 캐릭터라 어느 앱인지 바로 읽힌다 */
.brand {
  flex: none;
  width: 38px; height: 38px;
  border-radius: var(--r-full);
  background: #7E74AF;
  object-fit: cover;
}

/* ─────────────────────────────────────────────
   3-1. 첫 화면 (스플래시)

   앱이 열리는 순간 잠깐 보였다가 사라진다.
   흰 화면이 번쩍하는 것을 가려 주는 역할도 한다.
   ───────────────────────────────────────────── */
.splash {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #F7E5D0 center / cover no-repeat;
  display: grid;
  place-items: end center;
  transition: opacity .45s ease;
}
.splash.gone { opacity: 0; pointer-events: none; }
.splash[hidden] { display: none; }

/* 이미지가 화면 비율과 달라도 위아래가 비지 않게 배경색으로 메운다 */
.splash img {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 32%;
}

.splash-bar {
  position: relative;
  width: min(200px, 44vw);
  height: 5px;
  margin-bottom: calc(56px + env(safe-area-inset-bottom));
  border-radius: var(--r-full);
  background: rgba(90, 70, 40, .18);
  overflow: hidden;
}
.splash-bar::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: #8B7FB8;
  transform-origin: left;
  animation: load 1.5s cubic-bezier(.4,.1,.3,1) forwards;
}
@keyframes load { from { transform: scaleX(.05); } to { transform: scaleX(1); } }

/* 캐릭터 눈 깜빡임 — 가만히 있으면 그림이지만, 깜빡이면 살아 있는 느낌이 난다.
   여럿이 동시에 깜빡이면 기계 같아 보여서 자리마다 주기를 다르게 뒀다. */
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }

.eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink 5.4s infinite;
}
.daily-face   .eye { animation-duration: 6.4s; animation-delay: .9s; }
.install-face .eye { animation-duration: 4.6s; animation-delay: 1.7s; }
.cat          .eye { animation-duration: 7.2s; animation-delay: .4s; }
.empty        .eye { animation-duration: 4.2s; }

/* 빈 날의 캐릭터는 천천히 위아래로 */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.empty svg { animation: bob 3.4s ease-in-out infinite; }

.year  { font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.month { font-size: 27px; font-weight: 800; letter-spacing: -.02em; margin: 0; font-variant-numeric: tabular-nums; }

.nav { display: flex; align-items: center; gap: var(--s1); }

.nav-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  color: var(--ink-2);
  transition: background .15s ease;
}
.nav-btn:hover { background: var(--surface); }
.nav-btn svg { width: 18px; height: 18px; }

.today-btn {
  height: 34px;
  padding: 0 var(--s4);
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--shadow-sm);
  transition: transform .15s ease;
}
.today-btn:hover { transform: translateY(-1px); }
.today-btn[hidden] { display: none; }

/* ─────────────────────────────────────────────
   4. 월간 그리드
   ───────────────────────────────────────────── */
/* 달력이 이 앱의 주인공이다. 그림자와 여백을 다른 요소보다 확실히 키워
   화면에서 가장 먼저 눈에 들어오게 한다. */
.cal {
  margin: 0 var(--s4);
  padding: var(--s4) var(--s3) var(--s3);
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;                 /* 손가락을 따라 밀릴 때 밖으로 삐져나오지 않게 */
  /* 세로 스크롤은 그대로 두고 가로 움직임만 우리가 받는다 */
  touch-action: pan-y;
}

.dow, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }

.dow {
  padding-bottom: var(--s3);
  margin-bottom: var(--s2);
  border-bottom: 1.5px solid var(--line);
}
.dow span {
  text-align: center;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: .06em;
  color: var(--muted);
}
.dow span:first-child { color: var(--sun); }
.dow span:last-child  { color: var(--sat); }

/* 달을 넘길 때 방향에 맞춰 살짝 밀린다 — 어디로 갔는지 알려주는 신호 */
@keyframes gridIn {
  from { opacity: 0; transform: translateX(var(--slide, 0)); }
}
.grid.anim { animation: gridIn .22s cubic-bezier(.2,.7,.3,1); }

/* 손가락을 떼면 제자리로 미끄러져 돌아온다 */
.grid { transition: transform .22s cubic-bezier(.2,.7,.3,1); }
/* 끌고 있는 동안에는 손가락을 그대로 따라와야 하므로 전환을 끈다 */
.grid.dragging { transition: none; }

.cell {
  position: relative;
  height: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: var(--s1) 3px 0;
  border-radius: var(--r-md);
  overflow: hidden;
  transition: background .15s ease;
}
.cell:hover { background: var(--surface-2); }
.cell.out  { opacity: .32; }   /* 지난달·다음달 날짜 */

.num {
  display: grid;
  place-items: center;
  width: 26px; height: 26px;
  border-radius: var(--r-full);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
}
/* :not(.picked) 로 감싼 이유 — 고른 날은 노란 원에 짙은 글씨여야 하는데,
   요일 색 규칙이 더 구체적이라 그걸 덮어써 버렸다. */
.cell:not(.picked)[data-dow="0"] .num { color: var(--sun); }
.cell:not(.picked)[data-dow="6"] .num { color: var(--sat); }
.cell:not(.picked).holiday   .num { color: var(--sun); }

/* 오늘은 테두리, 고른 날은 채움.
   전에는 둘 다 노란 원이라 오늘을 고르면 무엇이 무엇인지 알 수 없었다. */
.cell.today  .num { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 800; }
.cell.picked .num { background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.cell.today.picked .num {
  box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--accent);
}

/* 날짜별 일정 요약 — 작은 막대에 제목까지 보여준다 */
.minis { width: 100%; display: flex; flex-direction: column; gap: 2px; }

.mini {
  height: 15px;
  padding: 0 4px;
  border-radius: 5px;
  background: color-mix(in oklab, var(--c) 34%, transparent);
  color: var(--ink);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 15px;
  text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mini.done { opacity: .42; text-decoration: line-through; }

/* 공휴일은 일정과 구분되게 빨간 계열로 */
.mini.holiday {
  background: color-mix(in oklab, var(--sun) 22%, transparent);
  color: var(--sun);
  font-weight: 800;
}

.more {
  padding-left: 4px;
  font-size: 10px;
  font-weight: 800;
  line-height: 11px;
  color: var(--muted);
  text-align: left;
}

/* ─────────────────────────────────────────────
   5. 오늘의 카드 — 달력 바로 아래 한 줄씩
   ───────────────────────────────────────────── */
.daily {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  margin: var(--s4) var(--s4) 0;
}
.daily[hidden] { display: none; }

/* 달력이 주인공이므로 이쪽은 한 단계 물러선다.
   흰 배경·그림자 대신 자기 색을 옅게 깔아 곁들임처럼 보이게 했다. */
.daily-card {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  padding: var(--s3);
  background: color-mix(in oklab, var(--c) 13%, var(--surface));
  border: 1.5px solid color-mix(in oklab, var(--c) 26%, transparent);
  border-radius: var(--r-md);
  text-align: left;
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.daily-card:hover {
  transform: translateY(-1px);
  background: color-mix(in oklab, var(--c) 20%, var(--surface));
  border-color: color-mix(in oklab, var(--c) 48%, transparent);
}
.daily-card:active { transform: translateY(0); }

.daily-face {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--surface);
}
.daily-face svg { width: 28px; height: 28px; }

.daily-body { flex: 1; min-width: 0; }
.daily-label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .05em;
  color: var(--c);
}
.daily-text {
  display: block;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.daily-go { flex: none; width: 16px; height: 16px; color: var(--muted); }

/* 카드를 누르면 열리는 팝업 안쪽 */
.detail {
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  max-height: 60svh;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.tagline {
  align-self: flex-start;
  padding: 3px var(--s3);
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--c) 22%, transparent);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--ink-2);
}

.detail h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  line-height: 1.42;
  letter-spacing: -.02em;
  text-wrap: balance;
}
.detail p { margin: 0; font-size: 15px; line-height: 1.75; color: var(--ink-2); }

.word-block { display: flex; flex-direction: column; gap: var(--s2); }

.word-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s3); }
.word { font-size: 30px; font-weight: 800; letter-spacing: -.025em; }
.pos  {
  padding: 2px var(--s2);
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--c) 24%, transparent);
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ink-2);
}

/* 발음기호와 한글 발음을 나란히 */
.word-sound { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s2); }
.ipa { font-size: 14px; font-weight: 500; color: var(--muted); }
.kr  { font-size: 14.5px; font-weight: 700; color: var(--c); letter-spacing: -.01em; }

.word-ko { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }

.ex-box {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  padding: var(--s4);
  background: var(--surface-2);
  border-radius: var(--r-md);
}
.ex-en { font-size: 15px; font-weight: 600; line-height: 1.5; }
.ex-ko { font-size: 13.5px; color: var(--ink-2); }

.tip { display: flex; gap: var(--s3); font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }
.tip b { flex: none; color: var(--c); font-weight: 800; letter-spacing: .04em; }

/* 소리 내어 읽어 주는 버튼.
   눌러야 할 것이 한눈에 보이도록 동그란 재생 버튼 모양으로 만든다.
   읽는 중에는 색을 채우고 테두리가 숨을 쉬어서, 소리가 안 들리는 곳에서도
   지금 재생 중이라는 걸 눈으로 알 수 있다. */
.say {
  flex: none;
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--c) 18%, var(--surface-2));
  border: 1.5px solid color-mix(in oklab, var(--c) 34%, transparent);
  color: color-mix(in oklab, var(--c) 65%, var(--ink));
  transition: background .15s ease, transform .12s ease;
}
.say svg { width: 17px; height: 17px; }
.say:hover  { background: color-mix(in oklab, var(--c) 30%, var(--surface-2)); }
.say:active { transform: scale(.92); }

.say.on {
  background: color-mix(in oklab, var(--c) 88%, var(--surface));
  border-color: transparent;
  color: #FFFFFF;
  animation: sayPulse 1.1s ease-in-out infinite;
}
@keyframes sayPulse {
  50% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--c) 20%, transparent); }
}

/* 단어 옆 버튼은 글자가 커서 조금 더 크게 잡고, 오른쪽 끝으로 민다 */
.word-head .say { width: 38px; height: 38px; margin-left: auto; align-self: center; }
.word-head .say svg { width: 19px; height: 19px; }

/* 예문과 듣기 버튼을 한 줄에 나란히 */
.ex-row { display: flex; align-items: center; gap: var(--s3); }
.ex-row .ex-en { flex: 1; min-width: 0; }

/* 내용이 바뀐 걸 알아채도록 살짝 올라오며 나타난다 */
@keyframes swapIn { from { opacity: 0; transform: translateY(8px); } }
.detail.swap > * { animation: swapIn .24s cubic-bezier(.2,.7,.3,1); }

.detail-actions { display: flex; gap: var(--s2); }

.shuffle {
  flex: 1;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  border-radius: var(--r-md);
  background: color-mix(in oklab, var(--c) 15%, var(--surface-2));
  border: 1.5px solid color-mix(in oklab, var(--c) 32%, transparent);
  color: var(--ink);
  font-size: 14.5px;
  font-weight: 700;
  transition: background .15s ease, transform .15s ease;
}
.shuffle:hover { background: color-mix(in oklab, var(--c) 24%, var(--surface-2)); transform: translateY(-1px); }
.shuffle:active { transform: translateY(0); }
.shuffle svg { width: 17px; height: 17px; }

/* 뉴스 원문으로 나가는 버튼. 앱 밖으로 나가는 링크라 '다른 것 보기' 와
   생김새를 맞추되, 색을 채워서 눌러야 할 것처럼 보이게 했다. */
.news-go {
  align-self: flex-start;
  height: 44px;
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  padding: 0 var(--s4);
  border-radius: var(--r-md);
  background: color-mix(in oklab, var(--c) 88%, var(--surface));
  color: #FFFFFF;
  font-size: 14.5px;
  font-weight: 800;
  text-decoration: none;
  transition: filter .15s ease, transform .15s ease;
}
.news-go:hover  { filter: brightness(1.07); transform: translateY(-1px); }
.news-go:active { transform: translateY(0); }
.news-go svg    { width: 16px; height: 16px; }


/* ─────────────────────────────────────────────
   6. 날짜 팝업 안의 일정 목록
   ───────────────────────────────────────────── */
.day-title { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; flex-wrap: wrap; }
.day-title h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.day-title h2.holiday { color: var(--sun); }
.day-title .count { font-size: 13px; color: var(--muted); font-weight: 600; flex: none; }

.holiday-tag {
  flex: none;
  padding: 2px var(--s2);
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--sun) 20%, transparent);
  color: var(--sun);
  font-size: 11.5px;
  font-weight: 800;
}

.events {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  max-height: 46svh;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin: 0 calc(var(--s1) * -1);
  padding: var(--s1);
}

.ev {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  padding: var(--s3) var(--s4) var(--s3) var(--s3);
  background: var(--surface);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  text-align: left;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.ev:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: color-mix(in oklab, var(--c) 40%, transparent); }
.ev:active { transform: translateY(0); }

.ev-face {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--c) 22%, transparent);
}
.ev-face svg { width: 28px; height: 28px; }

.ev-body { flex: 1; min-width: 0; }
.ev-time {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .03em;
  color: var(--c);
  font-variant-numeric: tabular-nums;
}
.ev-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-note {
  font-size: 12.5px;
  color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.ev.done { opacity: .55; }
.ev.done .ev-title { text-decoration: line-through; }

.check {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border: 2px solid var(--line);
  border-radius: var(--r-full);
  color: transparent;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.check:hover { border-color: var(--c); }
.check svg { width: 14px; height: 14px; }
.ev.done .check { background: var(--c); border-color: var(--c); color: #fff; }

/* 삭제 — 눌러도 곧바로 사라지지만 되돌릴 수 있다 */
.trash {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  color: var(--muted);
  transition: background .15s ease, color .15s ease;
}
.trash:hover { background: color-mix(in oklab, var(--danger) 16%, transparent); color: var(--danger); }
.trash svg { width: 15px; height: 15px; }

/* 되돌리기 알림 */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--s6) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--s4);
  max-width: calc(100% - var(--s8));
  padding: var(--s3) var(--s3) var(--s3) var(--s5);
  border-radius: var(--r-full);
  background: var(--ink);
  color: var(--bg);
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 60;
  animation: popUp .24s cubic-bezier(.2,.85,.3,1);
}
.toast[hidden] { display: none; }

.toast-undo {
  flex: none;
  height: 32px;
  padding: 0 var(--s4);
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13.5px;
  font-weight: 800;
}

/* 빈 날 */
.empty { padding: var(--s8) 0 var(--s6); text-align: center; }
.empty svg { width: 76px; height: 76px; opacity: .9; }
.empty p { margin: var(--s2) 0 0; font-size: 14px; color: var(--muted); font-weight: 500; }

.add-btn {
  width: 100%;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  border-radius: var(--r-md);
  border: 2px dashed var(--line);
  color: var(--ink-2);
  font-size: 14.5px;
  font-weight: 700;
  transition: border-color .15s ease, background .15s ease, color .15s ease;
}
.add-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.add-btn svg { width: 17px; height: 17px; }

/* ─────────────────────────────────────────────
   6-1. 설치 안내 막대

   크롬 메뉴에서 '앱 설치'를 찾기가 기기마다 달라 헷갈리므로
   앱 안에서 바로 설치할 수 있게 띄운다.
   ───────────────────────────────────────────── */
.install {
  position: fixed;
  left: 50%;
  bottom: calc(var(--s4) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(428px, calc(100% - var(--s8)));
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3);
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  z-index: 20;
  animation: popUp .32s cubic-bezier(.2,.85,.3,1);
}
.install[hidden] { display: none; }

@keyframes popUp {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
}

/* 막대가 떠 있을 때 마지막 카드가 가려지지 않게 자리를 비운다 */
body.has-install .app { padding-bottom: 128px; }

.install-face {
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--accent);
}
.install-face svg { width: 30px; height: 30px; }

.install-body { flex: 1; min-width: 0; }
.install-title { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
.install-desc {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.4;
}
.install-desc svg { width: 14px; height: 14px; flex: none; }

.install-btn {
  flex: none;
  height: 38px;
  padding: 0 var(--s4);
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 14px;
  font-weight: 800;
  transition: transform .15s ease;
}
.install-btn:hover { transform: translateY(-1px); }
.install-btn[hidden] { display: none; }

/* ─────────────────────────────────────────────
   6-2. 날씨

   달력 헤더의 동그란 버튼과, 그것을 눌렀을 때 뜨는 주간 예보 팝업.
   버튼과 팝업이 한 몸이라 스타일도 여기 모아 뒀다.

   왜 달력 칸에 넣지 않았나
     일기예보는 앞으로 7일치밖에 없다. 달력 칸에 얹으면 42칸 중
     35칸이 영원히 비어 고장난 것처럼 보인다. 7일은 격자보다
     세로 목록에 맞는 숫자라 팝업에 목록으로 담았다.
   ───────────────────────────────────────────── */

/* 헤더의 날씨 버튼 — 날씨를 못 받아온 동안에는 아예 없다.
   눌러도 아무 일 없는 버튼을 남기지 않는다 (읽어주기 버튼과 같은 규칙) */
/* '‹' 바로 왼쪽, 화살표 묶음(.nav) 안에 있다.
   화살표는 오른쪽 끝에 고정이라, 여기 있으면 '오늘' 버튼이 떴다 사라져도
   강아지가 제자리에 그대로 있는다. 헤더 바깥에 두면 그때마다 좌우로 흔들린다.

   크기는 44px 이 하한이다. 손가락으로 누르는 것이 그보다 작으면 잘 안 눌린다.
   강아지가 보여야 하는 자리이기도 해서 조금 더 키웠다. */
.wx-btn {
  position: relative;
  flex: none;
  /* 배지가 오른쪽으로 3px 삐져나오므로 화살표와 붙지 않게 띄운다 */
  margin: 0 var(--s2) 0 var(--s1);
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform .15s ease, background .15s ease;
  animation: wxPop .45s cubic-bezier(.2,.9,.3,1.3);
}
.wx-btn[hidden] { display: none; }
.wx-btn:hover { transform: translateY(-1px); }
.wx-btn:active { transform: translateY(0) scale(.93); }

/* 오늘 날씨의 강아지 얼굴 */
.wx-btn img {
  width: 100%; height: 100%;
  border-radius: var(--r-full);
  object-fit: cover;                 /* object-position 은 그림마다 다르므로 인라인으로 준다 */
  display: block;
}

/* 날씨 배지 — 강아지만으로는 무슨 날씨인지 안 보인다.
   이게 있어야 주머니에서 꺼내 보는 순간 비가 오는지 알 수 있다. */
.wx-btn-badge {
  position: absolute;
  right: -3px; bottom: -3px;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--surface);
  box-shadow: 0 1px 3px rgba(90,70,30,.22);
}
.wx-btn-badge svg { width: 18px; height: 18px; }

/* 그림을 못 받아왔으면 배지가 버튼 전체를 맡는다 */
.wx-btn:not(:has(img)) .wx-btn-badge {
  position: static;
  width: 34px; height: 34px;
  background: none;
  box-shadow: none;
}
.wx-btn:not(:has(img)) .wx-btn-badge svg { width: 34px; height: 34px; }

/* 처음 나타날 때 톡 튀어나온다. 조용히 생기면 생긴 줄 모른다 */
@keyframes wxPop { from { opacity: 0; transform: scale(.4) rotate(-25deg); } }

/* 좁은 폰에서 '오늘' 버튼까지 같이 보이면 헤더가 빠듯해진다.
   날씨 버튼이 34px 을 더 먹으므로 그만큼을 다른 데서 돌려받는다. */
@media (max-width: 400px) {
  .head { padding-left: var(--s4); padding-right: var(--s4); gap: var(--s2); }
  .title { gap: var(--s2); min-width: 0; }
  .today-btn { padding: 0 var(--s3); }
  .nav-btn { width: 33px; }
}

/* 그래도 모자라는 아주 좁은 폰에서는 연도를 접는다.
   '8월' 만 남아도 어느 달인지 아는 데 지장이 없다. 연도를 붙들고 있으면
   '오늘' 버튼이 두 글자가 위아래로 쪼개져 훨씬 보기 나쁘다. */
@media (max-width: 365px) {
  .year { display: none; }
  .brand { width: 34px; height: 34px; }
  .wx-btn { width: 42px; height: 42px; }
  .wx-btn-badge { width: 20px; height: 20px; }
  .wx-btn-badge svg { width: 16px; height: 16px; }
}

/* 자리가 모자라도 글자는 쪼개지 않는다. 줄바꿈보다 넘치는 편이 눈에 덜 거슬린다 */
.today-btn, .month, .year { white-space: nowrap; }

/* ── 팝업 안쪽 ── */
/* 스크롤 없이 한 화면에 담는 것이 이 팝업의 목표다.
   그래서 아래 값들은 '예쁘게' 가 아니라 '높이에 맞게' 정해져 있다.
   무언가를 키우려면 다른 데서 그만큼을 빼야 한다.

   max-height 는 그래도 남겨 둔다. 폰을 눕히면 화면이 아주 낮아지는데,
   그때까지 한 화면에 넣으려 들면 글씨가 읽을 수 없게 작아진다. */
.wx {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  /* 제목줄(34) 과 위아래 여백(40) 을 빼 둔다. 이걸 안 빼면 폰을 눕혔을 때
     팝업이 화면 밖으로 나가는데, 위 overflow:visible 때문에 굴릴 수도 없다 */
  max-height: calc(92svh - 76px);
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* ── 위에 매달린 종이 달력 ──

   시안의 그것이다. position:absolute 라 자리를 따로 먹지 않고,
   팝업 위 가장자리에 걸쳐 반쯤 밖으로 나온다.
   그래서 '한 화면에 담기' 규칙을 깨지 않는다. */
/* 브라우저가 dialog 에 기본으로 overflow:auto 를 걸어 둔다. 그대로 두면
   위로 삐져나온 종이 달력의 윗부분이 잘려 나간다.
   이 팝업은 안쪽 .wx 가 스스로 스크롤하므로 바깥은 잘라낼 필요가 없다. */
#wxSheet { overflow: visible; }
#wxSheet .sheet-in { position: relative; }

.wx-cal {
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%) rotate(-1.5deg);
  z-index: 2;
  width: 78px;
  padding: 0 0 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--surface);
  border: 2px solid var(--line);
  /* 아래 오른쪽만 덜 둥글게 — 종이가 말려 올라간 느낌 */
  border-radius: 12px 12px 16px 4px;
  box-shadow: var(--shadow-md);
}

/* 달력을 매단 고리 두 개 */
.wx-cal-ring {
  position: absolute;
  top: -7px;
  width: 6px; height: 13px;
  border: 2px solid var(--muted);
  border-radius: var(--r-full);
  background: var(--bg);
}
.wx-cal-ring:nth-of-type(1) { left: 18px; }
.wx-cal-ring:nth-of-type(2) { right: 18px; }

.wx-cal-top {
  width: 100%;
  padding: 2px 0 1px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 9px 9px 0 0;
  font-size: 11.5px; font-weight: 800; text-align: center;
}
.wx-cal-day {
  margin-top: 1px;
  font-size: 23px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.wx-cal-day small { font-size: 12px; font-weight: 700; margin-left: 1px; }
.wx-cal-dow { font-size: 10.5px; font-weight: 700; color: var(--ink-2); line-height: 1; }

/* 오늘 — 가장 크게 한 번. 나머지 날은 아래 목록으로.
   테두리를 조금 굵고 따뜻하게 잡아 손으로 그린 상자처럼 보이게 했다 */
.wx-now {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: var(--s3);
  background: var(--surface-2);
  border: 2px solid color-mix(in oklab, var(--line) 82%, var(--ink-2));
  border-radius: var(--r-lg);
}

/* 별·구름 스티커 — 오늘 칸 아래 가장자리에 걸터앉는다.
   absolute 라 높이를 먹지 않으므로 한 화면 규칙과 부딪히지 않는다 */
.wx-stickers {
  position: absolute;
  left: 2px; right: 2px; bottom: -9px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}
.wx-stickers span { display: block; width: 19px; height: 19px; }
.wx-stickers svg { width: 100%; height: 100%; display: block; }

/* 어두운 화면에서는 스티커가 너무 도드라진다. 장식이 주인공이 되면 안 된다 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .wx-stickers { opacity: .5; }
}
:root[data-theme="dark"] .wx-stickers { opacity: .5; }

/* 좌우 가장자리를 따라 내려가는 스티커 */
.wx-edge {
  position: absolute;
  top: 52px; bottom: 16px;
  width: 17px;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: center;
  pointer-events: none;
}
.wx-edge-l { left: 1px; }
.wx-edge-r { right: 1px; }
.wx-edge span { display: block; width: 16px; height: 16px; }
.wx-edge svg { width: 100%; height: 100%; display: block; }

/* 좁은 폰에서는 스티커가 다닥다닥 붙어 지저분해진다. 몇 개를 뺀다 */
@media (max-width: 355px) {
  .wx-stickers span:nth-child(even) { display: none; }
  .wx-stickers { justify-content: space-around; }
  .wx-edge { display: none; }          /* 여기선 양옆에 여유가 없다 */
}

/* 어두운 화면에서는 장식이 주인공이 되지 않게 한 단 낮춘다 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .wx-edge { opacity: .45; }
}
:root[data-theme="dark"] .wx-edge { opacity: .45; }

/* 오늘 날씨 그림 — 강아지가 그날 날씨를 하고 있다.
   세로 높이만 정하고 가로는 그림 비율대로 둔다. 배너처럼 잘라 넣으면
   강아지의 머리나 다리가 잘려 나간다.

   테두리를 두지 않고 가장자리를 부드럽게 지운다.
   네모난 액자에 넣으면 '사진을 붙였다' 로 보이는데, 가장자리를 흐리면
   그려 넣은 것처럼 배경에 녹아든다. 시안의 강아지가 그렇게 떠 있다.
   그림마다 배경색이 조금씩 달라도 경계가 안 보이는 것도 덤이다. */
.wx-photo {
  display: block;
  height: 104px;
  line-height: 0;
  /* 좌우를, 안쪽 img 가 위아래를 지운다. 둘을 겹쳐야 네 변이 모두 흐려진다.
     타원 하나로 지우면 강아지의 머리와 다리까지 같이 지워지고,
     타원을 키우면 위아래가 상자 밖에서 끝나 딱딱한 선이 남는다. */
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
}
.wx-photo img {
  height: 100%; width: auto; display: block;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 11%, #000 89%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 11%, #000 89%, transparent 100%);
}

/* 그림을 못 받아왔을 때만 코드로 그린 아이콘이 대신 나온다.
   깨진 그림 자리를 남기는 것보다 낫다 */
.wx-photo-alt { display: none; width: 76px; height: 76px; }
.wx-photo:not(:has(img)) { height: auto; }
.wx-photo:not(:has(img)) .wx-photo-alt { display: block; }

/* 어두운 화면에서는 밝은 그림이 그대로 있으면 눈이 부시다.
   밝기를 낮추고 테두리를 둘러 '액자에 든 그림'처럼 보이게 한다.
   테두리가 없으면 흰 종이가 허공에 떠 있는 것처럼 보인다. */
/* .is-dark 는 그림 자체가 어두운 것들이다 (밤·천둥번개·안개).
   밝은 그림만 한 단 낮춘다. 원래 어두운 그림까지 낮추면 시커멓게 뭉개진다. */
/* 액자를 없앤 뒤로는 테두리를 두르지 않는다. 가장자리가 이미 흐려서
   흰 종이가 허공에 떠 있어 보이지 않는다. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .wx-photo:not(.is-dark) img { filter: brightness(.68) saturate(.9); }
}
:root[data-theme="dark"] .wx-photo:not(.is-dark) img { filter: brightness(.68) saturate(.9); }

/* 온도는 이 팝업에서 가장 큰 글씨다. 제일 먼저 읽혀야 하는 값이라 그렇다 */
.wx-now-temp {
  margin-top: 2px;
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.wx-now-desc { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.wx-now-sub {
  margin-top: 2px;
  font-size: 13px; font-weight: 600; color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* 오늘 하루의 흐름 — 아침·낮·저녁·밤 네 토막.
   시간별 24개를 다 늘어놓으면 좁은 팝업에서 안 읽힌다 */
.wx-parts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  width: 100%;
  margin-top: var(--s3);
  padding-top: var(--s2);
  border-top: 1.5px dashed var(--line);
}
.wx-part { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.wx-part-when { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.wx-part svg { width: 30px; height: 30px; }
.wx-part-temp { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ── 앞으로 며칠 ── */
.wx-days { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }

/* 줄 하나의 칸 나누기. 머리글도 같은 값을 써야 '오전/오후' 글자가
   아이콘 바로 위에 온다. 한쪽만 고치면 어긋난다. */
.wx-day, .wx-days-head {
  display: grid;
  grid-template-columns: 42px 24px 24px 28px minmax(0, 1fr) 18px;
  gap: var(--s2);
}

.wx-days-head {
  padding: 0 var(--s1) 3px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted);
  text-align: center;
}

.wx-day {
  align-items: center;
  width: 100%;
  padding: 7px var(--s1);
  border-radius: var(--r-md);
  text-align: left;
  transition: background .15s ease;
}
.wx-day:hover { background: var(--surface-2); }
.wx-day:active { background: var(--line); }

.wx-when { font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; }
.wx-when.sun { color: var(--sun); }
.wx-when.sat { color: var(--sat); }
.wx-when small { font-weight: 600; color: var(--muted); font-size: 12px; }

.wx-day svg { width: 24px; height: 24px; }

/* 비 올 확률 — 0%인 날은 아예 비운다. 숫자가 줄줄이 0이면 눈만 어지럽다 */
.wx-pop {
  font-size: 12px; font-weight: 700;
  color: #5E9BC9;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* 최저 ~ 최고를 막대 하나로. 숫자만 늘어놓는 것보다 한 주의 흐름이 눈에 들어온다 */
.wx-range {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.wx-lo { color: var(--muted); flex: none; }
.wx-hi { color: var(--ink); flex: none; }
.wx-bar {
  position: relative;
  flex: 1; min-width: 20px;
  height: 6px;
  border-radius: var(--r-full);
  background: var(--line);
}
.wx-bar i {
  position: absolute; top: 0; bottom: 0;
  border-radius: var(--r-full);
}

/* 크레용으로 슥슥 칠한 듯한 결. 시안의 막대가 그렇게 생겼다.
   아주 옅게만 얹는다. 진하면 막대가 지저분해 보인다 */
.wx-bar i::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: repeating-linear-gradient(72deg,
    rgba(255,255,255,.34) 0 1.5px, transparent 1.5px 4px);
}

/* 그날 일정이 있다는 표시. 비 오는 날에 약속이 잡혀 있는지 한눈에 보라고 둔 것이다.
   제목까지 넣으면 날씨가 안 읽히므로 점만 찍는다 */
.wx-dots { display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-end; }
.wx-dots span { width: 6px; height: 6px; border-radius: var(--r-full); background: var(--c); }

/* 화면이 짧은 폰(아이폰 SE 같은)에서만 한 번 더 조인다.
   큰 폰까지 같이 줄이면 넓은 화면에서 옹색해 보인다. */
@media (max-height: 739px) {
  .wx { gap: var(--s2); }
  .wx-now { padding: var(--s2) var(--s3); }
  .wx-photo { height: 78px; }
  .wx-now-temp { font-size: 34px; }
  .wx-now-desc { font-size: 14px; }
  .wx-parts { margin-top: var(--s2); }
  .wx-part svg { width: 26px; height: 26px; }
  .wx-day { padding: 4px var(--s1); }
  .wx-day svg { width: 21px; height: 21px; }
  .wx-day, .wx-days-head { grid-template-columns: 40px 21px 21px 26px minmax(0, 1fr) 16px; gap: 6px; }
  .wx-cal { top: -26px; width: 70px; }
  .wx-cal-day { font-size: 20px; }
  .wx-stickers { bottom: -7px; }
  .wx-stickers span { width: 16px; height: 16px; }
}

/* ── 맨 아래 한 줄 ── */
.wx-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s2);
  font-size: 11.5px; font-weight: 600; color: var(--muted);
}
.wx-foot b { font-weight: 700; color: var(--ink-2); }

/* ── 받아오는 중 / 못 받아왔을 때 ── */
.wx-msg {
  display: flex; flex-direction: column; align-items: center; gap: var(--s3);
  padding: var(--s10) 0;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
  text-align: center;
}
/* 캐릭터만 크게 잡는다. 자식 선택자를 빼면 '다시 시도' 버튼 안의
   작은 아이콘까지 66px 이 되어 글씨를 덮어 버린다 */
.wx-msg > svg { width: 66px; height: 66px; animation: bob 3.4s ease-in-out infinite; }
.wx-msg .eye { animation-duration: 4.8s; }

/* ─────────────────────────────────────────────
   7. 입력 시트
   ───────────────────────────────────────────── */
dialog.sheet {
  width: min(460px, 100%);
  max-width: 100%;
  margin: auto auto 0;
  padding: 0;
  border: none;
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--shadow-lg);
}
@media (min-width: 560px) { dialog.sheet { margin: auto; border-radius: var(--r-xl); } }
dialog.sheet::backdrop { background: rgba(60,45,20,.4); backdrop-filter: blur(2px); }
dialog.sheet[open] { animation: rise .24s cubic-bezier(.2,.75,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

.sheet-in {
  padding: var(--s5) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: var(--s4);
}

.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }

.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  color: var(--muted);
  transition: background .15s ease;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 17px; height: 17px; }

.field { display: flex; flex-direction: column; gap: var(--s2); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }

.input {
  width: 100%;
  height: 48px;
  padding: 0 var(--s4);
  background: var(--surface-2);
  border: 2px solid var(--line);
  border-radius: var(--r-md);
  transition: border-color .15s ease;
}
.input:focus { outline: none; border-color: var(--accent); }
.input:disabled { opacity: .45; }
textarea.input { height: auto; padding: var(--s3) var(--s4); resize: vertical; min-height: 48px; }

.row { display: flex; gap: var(--s3); }
.row > * { flex: 1; min-width: 0; }

/* ─────────────────────────────────────────────
   시각 고르기

   기기 기본 입력창은 눌러도 반응이 보이지 않아
   내가 오전을 골랐는지 오후를 골랐는지 알 수 없었다.
   직접 만들어 누른 쪽이 확실히 드러나게 했다.
   ───────────────────────────────────────────── */
.timepick {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex-wrap: wrap;
}

.ampm {
  display: flex;
  flex: none;
  padding: 3px;
  gap: 3px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 2px solid var(--line);
}

.ampm button {
  min-width: 62px;
  height: 42px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  transition: background .16s ease, color .16s ease,
              font-size .16s ease, transform .12s ease;
}
/* 고른 쪽은 색이 차고 글자가 커지고 두꺼워진다 */
.ampm button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 16px;
  font-weight: 800;
  box-shadow: var(--shadow-sm);
}
.ampm button:active { transform: scale(.94); }

.sel {
  height: 48px;
  padding: 0 var(--s3);
  background: var(--surface-2);
  border: 2px solid var(--line);
  border-radius: var(--r-md);
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: center;
  transition: border-color .15s ease;
}
.sel:focus { outline: none; border-color: var(--accent); }

.unit { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-right: var(--s1); }

/* 하루 종일을 켜면 시각 고르기를 흐리게 */
.timepick.off { opacity: .4; pointer-events: none; }

/* 카테고리 고르기 — 캐릭터로 고른다 */
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }

.cat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s1);
  padding: var(--s3) var(--s1);
  border: 2px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  transition: border-color .15s ease, background .15s ease, transform .15s ease;
}
.cat svg { width: 34px; height: 34px; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
.cat:hover svg { transform: translateY(-2px) scale(1.06); }
.cat[aria-pressed="true"] {
  border-color: var(--c);
  background: color-mix(in oklab, var(--c) 16%, transparent);
  color: var(--ink);
  font-weight: 700;
}

/* 체크박스 두 개를 한 줄에 놓는다. 아주 좁은 폰에서는 자연스럽게 두 줄이 된다 */
.toggles { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); }

.toggle {
  display: flex; align-items: center; gap: var(--s2);
  font-size: 14px; color: var(--ink-2); cursor: pointer;
}
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

/* 일정 카드에 붙는 '매년' 딱지 — 생일인지 한 번뿐인 약속인지 구분해 준다 */
.ev-yearly {
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: var(--r-full);
  background: var(--accent-soft);
  color: var(--ink-2);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .02em;
  vertical-align: 1px;
}

.actions { display: flex; gap: var(--s3); margin-top: var(--s1); }

.btn { height: 52px; border-radius: var(--r-md); font-size: 15px; font-weight: 700; transition: transform .15s ease, opacity .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { flex: 1; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm); }
.btn-ghost { padding: 0 var(--s5); background: var(--surface-2); border: 2px solid var(--line); color: var(--danger); }
.btn-ghost[hidden] { display: none; }
</style>
</head>
<body>

<!-- 앱이 열릴 때 잠깐 보이는 첫 화면 -->
<div class="splash" id="splash">
  <img src="assets/splash.jpg" alt="캘비">
  <div class="splash-bar"></div>
</div>

<div class="app">

  <header class="head">
    <div class="title">
      <img class="brand" id="brand" src="icons/brand-144.png" alt="" width="38" height="38">
      <div class="title-text">
        <span class="year" id="year">2026년</span>
        <h1 class="month" id="monthLabel">8월</h1>
      </div>
    </div>

    <div class="nav">
      <button class="today-btn" id="todayBtn" hidden>오늘</button>
      <!-- '‹' 바로 왼쪽. 날씨를 못 받아온 동안에는 숨어 있는다 -->
      <button type="button" class="wx-btn" id="wxBtn" hidden aria-label="주간 예보 보기"></button>
      <button class="nav-btn" id="prevBtn" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav-btn" id="nextBtn" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </header>

  <section class="cal">
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 일정 확인하러 온 김에 눈에 들어오도록 달력 바로 아래 둔다 -->
  <section class="daily" id="daily"></section>

</div>

<!-- 삭제 후 되돌리기 -->
<div class="toast" id="toast" hidden>
  <span id="toastText">일정을 삭제했어요</span>
  <button class="toast-undo" id="toastUndo">되돌리기</button>
</div>

<!-- 설치 안내 막대 (설치 가능할 때만 나타난다) -->
<div class="install" id="installBar" hidden>
  <span class="install-face" id="installFace"></span>
  <div class="install-body">
    <div class="install-title">홈 화면에 추가</div>
    <div class="install-desc" id="installDesc">주소창 없이 앱처럼 쓸 수 있어요</div>
  </div>
  <button class="install-btn" id="installBtn">설치</button>
  <button class="icon-btn" id="installClose" aria-label="나중에 하기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>

<!-- 오늘의 상식 / 오늘의 단어 팝업 -->
<dialog class="sheet" id="dailySheet">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="dailyTitle">오늘의 상식</h2>
      <button type="button" class="icon-btn" id="dailyClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="detail" id="dailyBody"></div>
    <div class="detail-actions">
      <button type="button" class="shuffle" id="dailyShuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
        </svg>
        다른 것 보기
      </button>
    </div>
  </div>
</dialog>

<!-- 날짜를 누르면 뜨는 팝업 -->
<dialog class="sheet" id="daySheet">
  <div class="sheet-in">
    <div class="sheet-head">
      <div class="day-title">
        <h2 id="dayLabel">8월 13일 목요일</h2>
        <span class="holiday-tag" id="dayHoliday" hidden></span>
        <span class="count" id="dayCount"></span>
      </div>
      <button type="button" class="icon-btn" id="dayClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="events" id="events"></div>
    <button class="add-btn" id="addBtn">

    </button>

<!-- 콘텐츠는 앱 코드와 분리해 둔다. 상식·단어를 추가할 때 이 파일만 열면 된다.
     JSON이 아니라 .js 로 둔 이유: 파일을 그냥 더블클릭해서 열어도 동작하게 하려고. -->
<script src="data/knowledge.js"></script>
<script src="data/words.js"></script>
<script src="data/economy.js"></script>
<script src="data/holidays.js"></script>
<script src="data/news.js"></script>

<script>
/* ─────────────────────────────────────────────
   캐릭터 4종 — 그림 파일 없이 SVG로 직접 그린다
   ───────────────────────────────────────────── */
const FACE = (extra = "") => `
  <circle class="eye" cx="15.5" cy="22" r="1.9" fill="#3B322A"/>
  <circle class="eye" cx="24.5" cy="22" r="1.9" fill="#3B322A"/>
  <path d="M17.4 26.4q2.6 2.2 5.2 0" stroke="#3B322A" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <ellipse cx="11" cy="25.2" rx="2.3" ry="1.5" fill="#E0736A" opacity=".3"/>
  <ellipse cx="29" cy="25.2" rx="2.3" ry="1.5" fill="#E0736A" opacity=".3"/>
  ${extra}`;

const ART = {
  /* 콩이 — 일상 */
  life: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <path d="M20 11c.4-4 3.6-6.2 6.4-6-.4 4-3 6.4-6.4 6z" fill="#9BD89B"/>
    <ellipse cx="20" cy="23" rx="12.5" ry="11.5" fill="${c}"/>${FACE()}</svg>`,

  /* 몽이 — 일·공부 */
  work: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <g fill="${c}">
      <circle cx="12" cy="25" r="7.5"/><circle cx="28" cy="25" r="7.5"/>
      <circle cx="20" cy="18.5" r="9.5"/><rect x="12" y="21" width="16" height="11.5" rx="5.5"/>
    </g>${FACE()}</svg>`,

  /* 복이 — 건강 */
  health: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <path d="M21 12.5c-.3-4 2.4-6.6 5.4-6.5-.6 3.9-2.2 6.2-5.4 6.5z" fill="#9BD89B"/>
    <circle cx="20" cy="23" r="12.2" fill="${c}"/>
    <path d="M20 11.5q1.6 5 0 9" stroke="#3B322A" stroke-width="1.1" opacity=".18" fill="none"/>${FACE()}</svg>`,

  /* 별이 — 특별한 날 */
  special: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <path d="M20 7.5l3.9 8 8.8 1.2-6.4 6.2 1.5 8.7L20 27.5l-7.8 4.1 1.5-8.7-6.4-6.2 8.8-1.2z"
          fill="${c}" stroke="${c}" stroke-width="3.4" stroke-linejoin="round"/>${FACE()}</svg>`,
};

const CATS = [
  { id: "life",    name: "일상",  color: "#7BC47F" },
  { id: "work",    name: "일·공부", color: "#6EAEE0" },
  { id: "health",  name: "건강",  color: "#F49AB0" },
  { id: "special", name: "특별한 날", color: "#FFC93C" },
];

const catOf = id => CATS.find(c => c.id === id) || CATS[0];
const art   = id => ART[catOf(id).id](catOf(id).color);

/* ─────────────────────────────────────────────
   저장 — 이 브라우저에만 저장한다 (개인용)
   ───────────────────────────────────────────── */
const KEY = "mallang-cal:events";

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const save = () => localStorage.setItem(KEY, JSON.stringify(events));

/* 날짜를 YYYY-MM-DD 로 (시간대 오차를 피하려고 직접 만든다) */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const TODAY = ymd(new Date());

function seed() {
  const base = new Date();
  const day = n => { const d = new Date(base); d.setDate(d.getDate()+n); return ymd(d); };
  return [
    { id:"s1", date:day(0),  time:"08:30", title:"모닝 스트레칭",   cat:"health",  note:"15분",         done:true  },
    { id:"s2", date:day(0),  time:"14:00", title:"팀 회의",         cat:"work",    note:"3층 회의실",    done:false },
    { id:"s3", date:day(0),  time:"",      title:"장보기",           cat:"life",    note:"우유, 계란",    done:false },
    { id:"s4", date:day(2),  time:"19:00", title:"영화 보기",        cat:"life",    note:"",             done:false },
    { id:"s5", date:day(3),  time:"10:00", title:"치과 정기검진",    cat:"health",  note:"연세치과 3층",  done:false },
    { id:"s6", date:day(5),  time:"",      title:"엄마 생신",        cat:"special", note:"선물 준비!",    done:false },
    { id:"s7", date:day(-2), time:"09:00", title:"자격증 원서 접수", cat:"work",    note:"",             done:true  },
  ];
}

let events  = load() ?? seed();
let picked  = TODAY;                                  // 선택한 날짜
let view    = { y: +TODAY.slice(0,4), m: +TODAY.slice(5,7) };  // 보고 있는 달
let editing = null;

/* ─────────────────────────────────────────────
   화면 그리기
   ───────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const WD = ["일","월","화","수","목","금","토"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 매년 반복 일정이 이 날에 걸리는지.

   저장은 처음 넣은 날짜 하나로만 해 둔다. 해마다 복사본을 만들면
   몇 해 뒤에 수백 개가 쌓이고, 하나를 고칠 때 나머지가 안 따라온다. */
function yearlyOn(e, date) {
  if (!e.yearly) return false;
  const md = e.date.slice(5);
  if (md === date.slice(5)) return true;

  /* 2월 29일은 4년에 한 번만 있다. 그대로 두면 생일이 세 해씩 사라지므로
     윤년이 아닌 해에는 28일에 보여 준다. */
  if (md === "02-29" && date.slice(5) === "02-28") {
    const y = +date.slice(0, 4);
    return !((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0);
  }
  return false;
}

const eventsOn = date => events
  .filter(e => e.date === date || yearlyOn(e, date))
  .sort((a,b) => (a.time || "").localeCompare(b.time || ""));

/* 완료 표시.

   매년 반복은 해마다 따로 센다. 올해 생신을 챙겼다고 내년 것까지
   완료로 남아 있으면 안 되기 때문이다. */
const doneOn = (e, date) =>
  e.yearly ? (e.doneYears || []).includes(date.slice(0, 4)) : !!e.done;

function toggleDone(e, date) {
  if (!e.yearly) { e.done = !e.done; return; }
  const y = date.slice(0, 4);
  const had = e.doneYears || [];
  e.doneYears = had.includes(y) ? had.filter(v => v !== y) : [...had, y];
}

/* 공휴일 조회 — 없으면 null.
   양력 고정 공휴일은 모든 연도에서, 음력·대체공휴일은 표에 있는 해에만 잡힌다. */
function holidayOn(date) {
  if (typeof HOLIDAYS_FIXED === "undefined") return null;

  const year = date.slice(0, 4);
  const md   = date.slice(5);

  const fixed = HOLIDAYS_FIXED.find(([d]) => d === md);
  if (fixed) return fixed[1];

  const listed = (HOLIDAYS_BY_YEAR?.[year] || []).find(([d]) => d === md);
  return listed ? listed[1] : null;
}

function renderMonth() {
  $("year").textContent       = `${view.y}년`;
  $("monthLabel").textContent = `${view.m}월`;
  $("todayBtn").hidden        = view.y === +TODAY.slice(0,4) && view.m === +TODAY.slice(5,7);

  const lead = new Date(view.y, view.m - 1, 1).getDay();  // 1일 앞의 칸 수

  /* 항상 6줄(42칸)로 그린다.
     달마다 5줄·6줄로 달라지면 아래에 있는 오늘의 카드가 위아래로 튄다. */
  let html = "";
  for (let i = 0; i < 42; i++) {
    const d    = new Date(view.y, view.m - 1, 1 - lead + i);
    const date = ymd(d);
    const out  = d.getMonth() !== view.m - 1;           // 지난달·다음달
    const list = eventsOn(date);

    /* 칸이 좁다. 공휴일이 있으면 그것부터 보여주고 남는 자리에 일정을 넣는다 */
    const holiday = holidayOn(date);
    const room    = holiday ? 1 : 2;
    const rest    = list.length - room;

    const minis =
      (holiday ? `<span class="mini holiday">${esc(holiday)}</span>` : "") +
      list.slice(0, room)
        .map(e => `<span class="mini${doneOn(e, date) ? " done" : ""}" style="--c:${catOf(e.cat).color}">${esc(e.title)}</span>`)
        .join("") +
      (rest > 0 ? `<span class="more">+${rest}</span>` : "");

    html += `<button class="cell${out ? " out" : ""}${date === TODAY ? " today" : ""}${date === picked ? " picked" : ""}${holiday ? " holiday" : ""}"
                     data-date="${date}" data-dow="${i % 7}"
                     aria-label="${d.getMonth() + 1}월 ${d.getDate()}일${holiday ? " " + holiday : ""}, 일정 ${list.length}개">
               <span class="num">${d.getDate()}</span>
               <span class="minis">${minis}</span>
             </button>`;
  }
  $("grid").innerHTML = html;
}

/* 날짜 팝업 안쪽을 다시 그린다 */
function renderDaySheet() {
  const [y, m, d] = picked.split("-").map(Number);
  const w = new Date(y, m - 1, d).getDay();
  const list = eventsOn(picked);

  const holiday = holidayOn(picked);

  $("dayLabel").textContent = `${m}월 ${d}일 ${WD[w]}요일`;
  $("dayLabel").className   = holiday || w === 0 ? "holiday" : "";
  $("dayHoliday").textContent = holiday || "";
  $("dayHoliday").hidden      = !holiday;
  $("dayCount").textContent = list.length ? `${list.length}개` : "";

  if (!list.length) {
    $("events").innerHTML = `
      <div class="empty">${ART.life("#D8CDB4")}
        <p>아직 일정이 없어요</p>
      </div>`;
    return;
  }

  $("events").innerHTML = list.map(e => {
    const c = catOf(e.cat);
    return `
      <div class="ev${doneOn(e, picked) ? " done" : ""}" style="--c:${c.color}">
        <span class="ev-face">${art(e.cat)}</span>
        <button class="ev-body" data-edit="${e.id}">
          <span class="ev-time">${e.time || "하루 종일"}${
            e.yearly ? `<span class="ev-yearly">매년</span>` : ""}</span>
          <div class="ev-title">${esc(e.title)}</div>
          ${e.note ? `<div class="ev-note">${esc(e.note)}</div>` : ""}
        </button>
        <button class="check" data-toggle="${e.id}" aria-label="완료 표시"
                aria-pressed="${doneOn(e, picked)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
        <button class="trash" data-del="${e.id}" aria-label="삭제">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 002 2h6a2 2 0 002-2l1-14"/>
          </svg>
        </button>
      </div>`;
  }).join("");
}

/* 팝업이 열려 있을 때만 그 안쪽도 같이 갱신한다 */
const render = () => {
  renderMonth();
  if ($("daySheet").open) renderDaySheet();
};

/* 날짜를 눌렀을 때 — 팝업을 띄운다 */
function openDay(date) {
  picked = date;

  /* 지난달·다음달 날짜를 눌렀으면 그 달로 넘어간다 */
  const y = +date.slice(0, 4), m = +date.slice(5, 7);
  if (y !== view.y || m !== view.m) view = { y, m };

  renderMonth();
  renderDaySheet();
  if (!$("daySheet").open) $("daySheet").showModal();
}

/* ─────────────────────────────────────────────
   시각 고르기 — 오전·오후, 시, 분
   ───────────────────────────────────────────── */
$("fHour").innerHTML = Array.from({ length: 12 },
  (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
$("fMin").innerHTML = Array.from({ length: 12 },
  (_, i) => { const m = String(i * 5).padStart(2, "0"); return `<option value="${m}">${m}</option>`; }).join("");

let meridiem = "AM";

function paintMeridiem() {
  $("timePick").querySelectorAll(".ampm button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.mer === meridiem)));
}

/* "14:30" → 오후 2시 30분 */
function setTimeValue(hhmm) {
  if (!hhmm) { meridiem = "AM"; $("fHour").value = "9"; $("fMin").value = "00"; paintMeridiem(); return; }
  let [h, m] = hhmm.split(":").map(Number);
  meridiem = h < 12 ? "AM" : "PM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  $("fHour").value = String(h12);
  $("fMin").value  = String(Math.round(m / 5) * 5 % 60).padStart(2, "0");
  paintMeridiem();
}

/* 오후 2시 30분 → "14:30" */
function getTimeValue() {
  let h = Number($("fHour").value);
  if (meridiem === "AM" && h === 12) h = 0;
  if (meridiem === "PM" && h !== 12) h += 12;
  return `${String(h).padStart(2, "0")}:${$("fMin").value}`;
}

$("timePick").onclick = ev => {
  const b = ev.target.closest("button[data-mer]");
  if (!b) return;
  meridiem = b.dataset.mer;
  paintMeridiem();
};

/* ─────────────────────────────────────────────
   입력 시트
   ───────────────────────────────────────────── */
let pickedCat = "life";

function renderCats() {
  $("cats").innerHTML = CATS.map(c => `
    <button type="button" class="cat" data-cat="${c.id}" style="--c:${c.color}"
            aria-pressed="${c.id === pickedCat}">
      ${ART[c.id](c.color)}${esc(c.name)}
    </button>`).join("");
}

function openSheet(id) {
  editing = id ?? null;
  const e = id ? events.find(v => v.id === id) : null;

  $("sheetTitle").textContent = e ? "일정 수정" : "일정 추가";
  $("fTitle").value    = e?.title ?? "";
  $("fDate").value     = e?.date  ?? picked;
  setTimeValue(e?.time ?? "");
  $("fNote").value     = e?.note  ?? "";
  $("fAllday").checked = e ? !e.time : false;
  $("fYearly").checked = e ? !!e.yearly : false;
  $("timePick").classList.toggle("off", $("fAllday").checked);
  $("delBtn").hidden   = !e;
  pickedCat = e?.cat ?? "life";

  renderCats();
  $("sheet").showModal();
  if (!e) setTimeout(() => $("fTitle").focus(), 80);
}

/* ─────────────────────────────────────────────
   조작 연결
   ───────────────────────────────────────────── */
function shiftMonth(n) {
  const d = new Date(view.y, view.m - 1 + n, 1);
  view = { y: d.getFullYear(), m: d.getMonth() + 1 };
  renderMonth();

  /* 넘어간 방향으로 살짝 밀어준다 — 순간이동하면 어디로 갔는지 알기 어렵다 */
  const g = $("grid");
  g.style.setProperty("--slide", n > 0 ? "16px" : "-16px");
  g.classList.remove("anim");
  void g.offsetWidth;                    // 애니메이션을 다시 시작시키는 장치
  g.classList.add("anim");
}

$("prevBtn").onclick  = () => shiftMonth(-1);
$("nextBtn").onclick  = () => shiftMonth(1);
$("todayBtn").onclick = () => {
  view   = { y: +TODAY.slice(0,4), m: +TODAY.slice(5,7) };
  picked = TODAY;
  render();
};

/* 날짜를 누르면 그 날의 팝업이 뜬다 */
$("grid").onclick = ev => {
  const cell = ev.target.closest(".cell[data-date]");
  if (!cell) return;
  openDay(cell.dataset.date);
};

$("dayClose").onclick = () => $("daySheet").close();

/* ─────────────────────────────────────────────
   달력 좌우로 밀어 달 넘기기

   까다로운 점이 둘이다.
   하나는 세로 스크롤을 막지 않는 것, 다른 하나는 날짜를 누르려다
   손가락이 조금 밀렸을 때 엉뚱하게 달이 넘어가지 않는 것이다.
   그래서 '가로로 뚜렷하게' 움직였을 때만 스와이프로 친다.
   ───────────────────────────────────────────── */
(function monthSwipe() {
  const cal  = document.querySelector(".cal");
  const grid = $("grid");

  const START   = 12;   // 이만큼 움직여야 '밀기 시작'으로 본다
  const CONFIRM = 55;   // 이만큼 넘겨야 달이 바뀐다
  const RATIO   = 1.4;  // 가로가 세로보다 이 배수 이상이어야 가로 밀기

  let sx = 0, sy = 0;
  let tracking = false, sliding = false, swiped = false;

  const reset = () => {
    tracking = sliding = false;
    grid.classList.remove("dragging");
    grid.style.transform = "";
  };

  cal.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    sx = e.clientX; sy = e.clientY;
    tracking = true; sliding = false;
  });

  window.addEventListener("pointermove", e => {
    if (!tracking) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;

    if (!sliding) {
      if (Math.abs(dy) > START && Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }  // 세로 스크롤이다
      if (Math.abs(dx) < START || Math.abs(dx) < Math.abs(dy) * RATIO) return;
      sliding = true;
      grid.classList.add("dragging");
    }

    /* 끝으로 갈수록 덜 따라오게 해서 '한계가 있다'는 느낌을 준다 */
    grid.style.transform = `translateX(${dx * 0.45}px)`;
  }, { passive: true });

  window.addEventListener("pointerup", e => {
    if (!tracking) return;
    const dx = e.clientX - sx;
    const go = sliding && Math.abs(dx) >= CONFIRM;
    reset();

    if (go) {
      swiped = true;                       // 뒤따라오는 클릭을 무시하기 위한 표시
      setTimeout(() => { swiped = false; }, 350);
      shiftMonth(dx < 0 ? 1 : -1);         // 왼쪽으로 밀면 다음 달
    }
  });

  window.addEventListener("pointercancel", reset);

  /* 밀어서 넘긴 직후의 클릭은 날짜 선택으로 치지 않는다 */
  cal.addEventListener("click", e => {
    if (!swiped) return;
    e.stopPropagation();
    e.preventDefault();
  }, true);
})();

/* ─────────────────────────────────────────────
   삭제 — 확인 창으로 막지 않고, 지운 뒤 되돌릴 수 있게 한다.
   묻고 답하는 것보다 실수했을 때 한 번에 되돌리는 쪽이 덜 번거롭다.
   ───────────────────────────────────────────── */
let undoItem = null, undoTimer = null;

function removeEvent(id) {
  const i = events.findIndex(v => v.id === id);
  if (i < 0) return;

  undoItem = { event: events[i], at: i };
  events.splice(i, 1);
  save();
  render();

  $("toastText").textContent = `'${undoItem.event.title}' 삭제됨`;
  $("toast").hidden = false;

  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { $("toast").hidden = true; undoItem = null; }, 6000);
}

$("toastUndo").onclick = () => {
  if (!undoItem) return;
  events.splice(undoItem.at, 0, undoItem.event);   // 있던 자리에 그대로 되돌린다
  save();
  undoItem = null;
  clearTimeout(undoTimer);
  $("toast").hidden = true;
  render();
};

$("events").onclick = ev => {
  const del = ev.target.closest("[data-del]");
  if (del) return removeEvent(del.dataset.del);

  const toggle = ev.target.closest("[data-toggle]");
  if (toggle) {
    const e = events.find(v => v.id === toggle.dataset.toggle);
    if (e) { toggleDone(e, picked); save(); render(); }
    return;
  }

  const edit = ev.target.closest("[data-edit]");
  if (edit) openSheet(edit.dataset.edit);
};

$("addBtn").onclick   = () => openSheet();
$("closeBtn").onclick = () => $("sheet").close();

$("cats").onclick = ev => {
  const btn = ev.target.closest(".cat");
  if (!btn) return;
  pickedCat = btn.dataset.cat;
  renderCats();
};

$("fAllday").onchange = ev => {
  $("timePick").classList.toggle("off", ev.target.checked);
};

$("delBtn").onclick = () => {
  events = events.filter(v => v.id !== editing);
  save();
  $("sheet").close();
  render();
};

$("form").onsubmit = ev => {
  ev.preventDefault();

  const data = {
    title:  $("fTitle").value.trim(),
    date:   $("fDate").value,
    time:   $("fAllday").checked ? "" : getTimeValue(),
    note:   $("fNote").value.trim(),
    cat:    pickedCat,
    yearly: $("fYearly").checked,
  };
  if (!data.title || !data.date) return;

  if (editing) {
    const e = events.find(v => v.id === editing);
    /* 반복 여부를 바꾸면 완료 표시가 서로 맞지 않는다.
       한 번뿐인 일정은 done 하나로, 매년 반복은 해마다 따로 세기 때문이다.
       섞이면 엉뚱한 해가 완료로 남으므로 갈아탈 때 지운다. */
    if (!!e.yearly !== data.yearly) { e.done = false; e.doneYears = []; }
    Object.assign(e, data);
  } else {
    events.push({ id: String(Date.now()), done: false, doneYears: [], ...data });
  }

  save();
  picked = data.date;                                   // 저장한 날로 이동
  view   = { y: +data.date.slice(0,4), m: +data.date.slice(5,7) };
  $("sheet").close();
  render();
};

/* ─────────────────────────────────────────────
   오늘의 상식 / 오늘의 단어

   날짜로 순서를 정한다. 무작위로 뽑으면 새로고침할 때마다
   내용이 바뀌어서 '오늘의'라는 말이 무의미해지기 때문이다.
   ───────────────────────────────────────────── */
const DAILY = {
  knowledge: { label: "일반상식", color: "#A98BD4", shape: "special" },
  economy:   { label: "경제상식", color: "#D4A02C", shape: "life"    },
  word:      { label: "영단어",   color: "#4FB3AC", shape: "work"    },
  news:      { label: "경제뉴스", color: "#5B8FCC", shape: "health"  },
};

/* 뉴스는 하루 한 번 GitHub 이 받아다 data/news.js 로 넣어 준다.
   못 받아온 날이 있을 수 있어서, 없으면 빈 목록으로 두고 카드를 뺀다. */
const listOf = kind =>
  kind === "knowledge" ? KNOWLEDGE :
  kind === "economy"   ? ECONOMY   :
  kind === "news"      ? (typeof NEWS === "undefined" ? [] : NEWS) : WORDS;

/* ─────────────────────────────────────────────
   영단어 읽어주기

   폰과 컴퓨터에 이미 들어 있는 음성 합성 기능을 그대로 쓴다.
   소리 파일을 앱에 넣지 않아도 되고, 기기에 저장된 목소리가 잡히면
   비행기 모드에서도 그대로 읽어 준다.

   이 기능이 없는 브라우저도 있어서, 없으면 SAY 가 null 이 되고
   버튼 자체를 만들지 않는다. 눌러도 아무 일 없는 버튼은 없느니만 못하다.
   ───────────────────────────────────────────── */
const SAY = (() => {
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === "undefined") return null;

  /* 맥에는 장난스러운 목소리(Zarvox, Bubbles 같은)가 함께 깔려 있는데
     이런 게 잡히면 학습에 방해가 되므로 미리 걸러 낸다. */
  const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|jester|junior|kathy|organ|princess|ralph|superstar|trinoids|whisper|wobble|zarvox/i;

  /* 기기마다 목소리 이름이 다 달라서 이름으로 찍지 않고 조건에 점수를 매긴다.
     localService 를 높게 치는 이유는 그래야 인터넷 없이도 소리가 나기 때문이다. */
  let voice = null;
  const pickVoice = () => {
    const list = synth.getVoices()
      .filter(v => /^en([-_]|$)/i.test(v.lang) && !NOVELTY.test(v.name));
    if (!list.length) return;
    const score = v =>
      (/^en[-_]US/i.test(v.lang) ? 4 : 0) +
      (v.localService ? 2 : 0) +
      (v.default ? 1 : 0);
    voice = list.slice().sort((a, b) => score(b) - score(a))[0];
  };
  pickVoice();
  /* 목소리 목록은 늦게 도착하기도 한다. 그때 다시 고른다. */
  synth.addEventListener?.("voiceschanged", pickVoice);

  let playing = null;                       // 지금 읽고 있는 것의 이름
  const watchers = new Set();
  const notify = () => watchers.forEach(fn => fn(playing));

  const stop = () => {
    playing = null;
    synth.cancel();
    notify();
  };

  return {
    get playing() { return playing; },
    watch(fn) { watchers.add(fn); },
    stop,

    /* 같은 버튼을 다시 누르면 멈춘다. 읽는 도중에 다른 버튼을 누르면
       앞의 것을 끊고 새로 읽는다. 두 소리가 겹치는 것이 가장 듣기 나쁘다. */
    toggle(key, text, rate) {
      const again = playing === key;
      const busy  = synth.speaking || synth.pending;

      if (busy) synth.cancel();             // 읽던 것이 없으면 굳이 건드리지 않는다
      playing = null;
      if (again || !text) { notify(); return; }

      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-US";
      u.rate = rate;                        // 배우는 중이니 원래 속도보다 느리게
      u.pitch = 1;
      const done = () => { if (playing === key) { playing = null; notify(); } };
      u.onend = done;
      u.onerror = done;

      playing = key;
      notify();
      synth.resume();                       // 멈춤 상태로 남아 있으면 소리가 안 난다

      /* 아이폰은 cancel() 바로 뒤에 speak() 를 부르면 소리를 삼키는 일이 있다.
         끊고 새로 읽을 때만 한 박자 쉬고, 처음 누른 것은 손가락을 뗀 그 자리에서
         바로 읽는다. (아이폰은 첫 소리가 사용자 조작 안에서 나야 한다) */
      if (busy) setTimeout(() => { if (playing === key) synth.speak(u); }, 80);
      else      synth.speak(u);
    },
  };
})();

/* 앱을 열 때마다 새로 뽑는다.
   날짜로 고정하면 하루 종일 같은 것만 보이는데,
   나갔다 들어올 때마다 바뀌는 편이 더 읽게 된다. */
let shown = {};

function drawAll() {
  Object.keys(DAILY).forEach(k => {
    const n = listOf(k).length;
    shown[k] = n ? Math.floor(Math.random() * n) : 0;
  });
}

const CHEVRON = `<svg class="daily-go" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;

function dailyCard(kind, text) {
  const d = DAILY[kind];
  return `
    <button class="daily-card" data-daily="${kind}" style="--c:${d.color}">
      <span class="daily-face">${ART[d.shape](d.color)}</span>
      <span class="daily-body">
        <span class="daily-label">${d.label}</span>
        <span class="daily-text">${esc(text)}</span>
      </span>
      ${CHEVRON}
    </button>`;
}

function renderDaily() {
  const k = listOf("knowledge")[shown.knowledge];
  const e = listOf("economy")[shown.economy];
  const w = listOf("word")[shown.word];
  const n = listOf("news")[shown.news];

  /* 카드는 한 줄뿐이라 단어 뜻은 첫 번째 것만 보여준다 */
  $("daily").innerHTML =
    dailyCard("knowledge", k.q) +
    dailyCard("economy",   e.q) +
    dailyCard("word", `${w.word}${w.kr ? ` [${w.kr}]` : ""} · ${w.ko.split(",")[0]}`) +
    /* 뉴스를 못 받아온 날은 카드를 아예 뺀다. 빈 카드가 남는 것보다 낫다 */
    (n ? dailyCard("news", n.q) : "");
}

/* 지금 팝업에서 보고 있는 종류 */
let daily = { kind: "knowledge" };

const SPEAKER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 9a4 4 0 010 6"/><path d="M18.5 6.5a8 8 0 010 11"/></svg>`;

/* 읽어주기를 못 하는 브라우저에서는 빈 문자열이 되어 버튼이 아예 안 생긴다 */
const sayBtn = (what, label) => SAY
  ? `<button type="button" class="say" data-say="${what}" aria-label="${label}" title="${label}">${SPEAKER}</button>`
  : "";

function bodyHTML(kind, item) {
  /* 뉴스는 제목만 싣고 본문은 원문으로 보낸다. 옮겨 싣지 않는 이유는
     scripts/build-news.mjs 주석에 적어 두었다. */
  if (kind === "news") {
    return `
      <span class="tagline">연합뉴스 · ${esc(item.at)}</span>
      <h3>${esc(item.q)}</h3>
      <a class="news-go" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">
        기사 읽기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/>
        </svg>
      </a>`;
  }

  if (kind !== "word") {
    return `
      <span class="tagline">${esc(item.tag)}</span>
      <h3>${esc(item.q)}</h3>
      <p>${esc(item.a)}</p>`;
  }
  return `
    <div class="word-block">
      <div class="word-head">
        <span class="word">${esc(item.word)}</span>
        <span class="pos">${esc(item.pos)}</span>
        ${sayBtn("word", "단어 듣기")}
      </div>
      <div class="word-sound">
        <span class="ipa">${esc(item.ipa)}</span>
        ${item.kr ? `<span class="kr">[${esc(item.kr)}]</span>` : ""}
      </div>
      <div class="word-ko">${esc(item.ko)}</div>
    </div>
    <div class="ex-box">
      <div class="ex-row">
        <div class="ex-en">${esc(item.ex)}</div>
        ${sayBtn("ex", "예문 듣기")}
      </div>
      <div class="ex-ko">${esc(item.exKo)}</div>
    </div>
    ${item.tip ? `<div class="tip"><b>TIP</b><span>${esc(item.tip)}</span></div>` : ""}`;
}

function paintDailySheet({ animate } = {}) {
  const d = DAILY[daily.kind];

  SAY?.stop();                         // 내용이 바뀌는데 옛 소리가 이어지면 안 된다

  $("dailySheet").style.setProperty("--c", d.color);
  $("dailyTitle").textContent = d.label;
  $("dailyBody").innerHTML = bodyHTML(daily.kind, listOf(daily.kind)[shown[daily.kind]]);

  if (animate) {                       // 애니메이션을 처음부터 다시 재생시킨다
    $("dailyBody").classList.remove("swap");
    void $("dailyBody").offsetWidth;
    $("dailyBody").classList.add("swap");
  }
}

function openDaily(kind) {
  daily = { kind };
  paintDailySheet();
  $("dailySheet").showModal();
}

/* 방금 본 것이 또 나오면 눌러도 안 바뀐 것처럼 느껴진다. 반드시 다른 것을 고른다. */
$("dailyShuffle").onclick = () => {
  const n = listOf(daily.kind).length;
  if (n < 2) return;

  const now = shown[daily.kind];
  let next = now;
  while (next === now) next = Math.floor(Math.random() * n);

  shown[daily.kind] = next;
  paintDailySheet({ animate: true });
  renderDaily();                       // 뒤에 있는 카드도 같이 맞춰 준다
};


$("daily").onclick = ev => {
  const card = ev.target.closest("[data-daily]");
  if (card) openDaily(card.dataset.daily);
};
$("dailyClose").onclick = () => $("dailySheet").close();

/* 읽어주기 버튼.
   내용이 새로 그려질 때마다 버튼도 새로 만들어지므로,
   버튼 하나하나가 아니라 바깥 상자에 한 번만 걸어 둔다. */
if (SAY) {
  $("dailyBody").addEventListener("click", ev => {
    const btn = ev.target.closest("[data-say]");
    if (!btn) return;

    const item = listOf(daily.kind)[shown[daily.kind]];
    if (!item) return;

    /* 단어는 한 덩어리라 뭉개지기 쉬워 더 느리게,
       문장은 너무 늦추면 말의 흐름이 사라져서 조금만 늦춘다. */
    if (btn.dataset.say === "word") SAY.toggle("word", item.word, .72);
    else                            SAY.toggle("ex",   item.ex,   .88);
  });

  /* 다 읽었거나 도중에 끊겼을 때 버튼을 원래대로 되돌린다 */
  SAY.watch(now => $("dailyBody").querySelectorAll("[data-say]")
    .forEach(b => b.classList.toggle("on", b.dataset.say === now)));

  /* 팝업을 닫거나 앱을 내리면 소리도 함께 멈춘다.
     화면에 없는 소리가 계속 나오는 것만큼 당황스러운 일이 없다. */
  $("dailySheet").addEventListener("close", () => SAY.stop());
  document.addEventListener("visibilitychange", () => { if (document.hidden) SAY.stop(); });
}

/* 콘텐츠 파일을 못 읽었으면 카드를 아예 감춘다 */
const dataReady =
  typeof KNOWLEDGE !== "undefined" && KNOWLEDGE.length &&
  typeof ECONOMY   !== "undefined" && ECONOMY.length &&
  typeof WORDS     !== "undefined" && WORDS.length;

if (dataReady) {
  drawAll();
  renderDaily();
} else {
  $("daily").hidden = true;
}

render();

/* ─────────────────────────────────────────────
   첫 화면 걷어내기

   달력이 다 그려진 뒤에 사라지게 한다. 그림이 준비되기 전에
   걷으면 빈 화면이 잠깐 보인다.
   ───────────────────────────────────────────── */
(function hideSplash() {
  const el = $("splash");
  const MIN_MS = 1400;              // 너무 빨리 사라지면 깜빡인 것처럼 보인다
  const start = performance.now();

  const done = () => {
    const wait = Math.max(0, MIN_MS - (performance.now() - start));
    setTimeout(() => {
      el.classList.add("gone");
      window.scrollTo(0, 0);        // 첫 화면이 걷히면 달력 맨 위부터 보이게
      setTimeout(() => { el.hidden = true; }, 500);
    }, wait);
  };

  const img = el.querySelector("img");
  if (img.complete) done();
  else { img.addEventListener("load", done); img.addEventListener("error", done); }

  setTimeout(done, 4000);           // 이미지가 끝내 안 오면 그냥 걷는다
})();

/* ─────────────────────────────────────────────
   홈 화면에 추가 안내

   안드로이드(크롬)는 브라우저가 '설치해도 된다'고 알려주면
   그 순간을 붙잡아 두었다가 버튼을 눌렀을 때 설치창을 띄운다.
   아이폰은 애플이 이 기능을 막아두어서 안내 문구만 보여준다.
   ───────────────────────────────────────────── */
const INSTALL_KEY = "mallang-cal:install-hidden-until";

/* 이미 홈 화면 앱으로 열려 있는가 */
const isInstalled = () =>
  matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

const isIOS = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);  // 아이패드

/* 닫기를 누르면 일주일 동안 다시 뜨지 않는다 */
const snoozed = () => Number(localStorage.getItem(INSTALL_KEY) || 0) > Date.now();

let deferredPrompt = null;

const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/></svg>`;

/* mode
   "prompt" 크롬이 설치해도 된다고 알려온 경우 — 버튼 한 번으로 끝난다
   "ios"    아이폰 — 애플이 막아두어 공유 메뉴로 안내한다
   "manual" 신호가 오지 않은 경우 — 메뉴 위치를 알려준다 */
function showInstall(mode) {
  if (isInstalled() || snoozed() || !$("installBar").hidden) return;

  $("installFace").innerHTML = ART.life("#FFFFFF");
  $("installBtn").hidden = false;
  $("installBtn").textContent = mode === "prompt" ? "설치" : "방법 보기";

  if (mode === "ios") {
    $("installDesc").innerHTML = `${SHARE_ICON} 공유 버튼 → '홈 화면에 추가'`;
  } else if (mode === "manual") {
    /* 브라우저마다 메뉴 이름이 달라서(크롬 '앱 설치', 삼성 '현재 페이지 추가')
       여기서는 단정하지 않고 안내 페이지로 넘긴다 */
    $("installDesc").textContent = "내 폰에 맞는 방법을 알려드려요";
  }

  $("installBar").hidden = false;
  document.body.classList.add("has-install");
}

function hideInstall(snoozeDays = 0) {
  $("installBar").hidden = true;
  document.body.classList.remove("has-install");
  if (snoozeDays) {
    localStorage.setItem(INSTALL_KEY, String(Date.now() + snoozeDays * 864e5));
  }
}

/* 크롬이 '설치 가능'을 알려주는 순간 — 기본 안내를 막고 우리 막대를 띄운다 */
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstall("prompt");
});

$("installBtn").onclick = async () => {
  /* 브라우저가 설치를 허락한 경우에는 버튼 한 번으로 끝난다 */
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;    // 설치했든 취소했든 이 창은 한 번만 쓸 수 있다
    deferredPrompt = null;
    hideInstall();
    return;
  }
  /* 그렇지 않으면 기기에 맞는 안내 페이지로 보낸다 */
  location.href = "install.html";
};

$("installClose").onclick = () => hideInstall(7);

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  hideInstall();
});

/* 신호를 기다리되, 오지 않아도 안내는 뜨게 한다.
   브라우저마다 신호를 보내는 조건이 달라서, 신호에만 기대면
   아무것도 안 보이는 상태가 되어버린다. */
setTimeout(() => {
  if (isInstalled()) return;
  showInstall(isIOS() ? "ios" : "manual");
}, 2500);

function wxPhoto(code, night) {
  const p = (name, dark) => ({
    src: `icons/weather/${name}.jpg`, dark: !!dark, face: WX_CROP_AT[name] || "50% 42%",
  });

  if (code === 45 || code === 48) return p("fog", true);                 // 안개

}

/* 세계기상기구(WMO) 코드를 그림 일곱 가지로 줄인다.
   코드는 100가지 가까이 되지만 작은 아이콘으로 구분되는 것은 이 정도가 한계다 */
function wxKind(code, night) {
  if (code === 0) return night ? "night" : "clear";
  if (code === 1 || code === 2) return night ? "nightCloud" : "partly";
  if (code === 3) return "cloudy";
  if (code === 45 || code === 48) return "fog";
  if (code >= 95) return "thunder";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  return "rain";                       // 51~67 이슬비·비, 80~82 소나기
}

const wxColor = t =>

let wx     = null;      // 마지막으로 받아 둔 예보
let wxBusy = false;     // 지금 받아오는 중

/* 저장해 둔 것을 꺼낸다. 오늘이 들어 있지 않은 예보는 이미 지난 것이라 버린다.
   (어제 받아 둔 것에는 오늘이 들어 있으므로, 비행기 모드에서도 쓸 수 있다) */
function wxLoad() {

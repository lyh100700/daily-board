<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말랑 캘린더</title>

<!-- 폰 홈화면에 앱처럼 설치되기 위한 설정 -->
<meta name="description" content="달력에서 날짜를 고르면 그 날의 일정을 바로 쓰고 고치는 개인용 캘린더">
<meta name="theme-color" content="#FFF6DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231E17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="말랑">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">

<style>
/* ─────────────────────────────────────────────
   0. 글꼴 — Nunito (SIL Open Font License)
      끝이 둥근 글꼴이라 캐릭터의 둥근 형태와 결이 맞는다.
      숫자와 알파벳에만 쓰이고, 한글은 시스템 글꼴로 넘어간다.
      (한글 웹폰트는 수 MB라 앱에 심을 수 없다)
   ───────────────────────────────────────────── */
@font-face {
  font-family: "Nunito";
  font-style: normal;
  font-weight: 400 900;
  font-display: swap;
  src: url("fonts/nunito-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2013-2014,
                 U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A,
                 U+2044, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ─────────────────────────────────────────────
   1. 디자인 토큰 — 색과 간격을 여기서만 정한다.
      색이 질리면 이 30줄만 고치면 앱 전체가 바뀐다.
   ───────────────────────────────────────────── */
:root {
  --bg:          #FFF6DE;   /* 버터 옐로 바탕 */
  --surface:     #FFFFFF;
  --surface-2:   #FFFBF0;
  --line:        #F0E4C4;
  --ink:         #3B322A;   /* 검정 대신 따뜻한 갈색 */
  --ink-2:       #7A6A57;
  --muted:       #B0A088;
  --accent:      #FFD400;   /* 포인트 노랑 */
  --accent-ink:  #3B322A;
  --accent-soft: #FFF0B8;
  --danger:      #E07A6B;
  --sun:         #E0736A;
  --sat:         #6E9BD1;

  --shadow-sm: 0 1px 2px rgba(90,70,30,.06);
  --shadow-md: 0 2px 4px rgba(90,70,30,.05), 0 10px 26px rgba(90,70,30,.09);
  --shadow-lg: 0 4px 10px rgba(90,70,30,.10), 0 20px 46px rgba(90,70,30,.18);

  /* 간격은 4의 배수만 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  /* 둥글둥글하게 — 이 앱의 성격이다 */
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:32px; --r-full:999px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#231E17; --surface:#2E2820; --surface-2:#352E25; --line:#453C2E;
    --ink:#F6F0E2; --ink-2:#C3B49C; --muted:#8E7F66;
    --accent:#FFD84D; --accent-ink:#241F17; --accent-soft:#3E3520;
    --danger:#EE9384; --sun:#EE8E85; --sat:#8FB6E4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 2px 4px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.38);
    --shadow-lg: 0 4px 10px rgba(0,0,0,.4), 0 20px 46px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:#231E17; --surface:#2E2820; --surface-2:#352E25; --line:#453C2E;
  --ink:#F6F0E2; --ink-2:#C3B49C; --muted:#8E7F66;
  --accent:#FFD84D; --accent-ink:#241F17; --accent-soft:#3E3520;
  --danger:#EE9384; --sun:#EE8E85; --sat:#8FB6E4;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-md: 0 2px 4px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.38);
  --shadow-lg: 0 4px 10px rgba(0,0,0,.4), 0 20px 46px rgba(0,0,0,.5);
}

/* ─────────────────────────────────────────────
   2. 기본
   ───────────────────────────────────────────── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  /* Nunito를 앞에 두면 숫자·알파벳만 가져가고 한글은 자동으로 뒤로 넘어간다 */
  font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }

:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100svh;
  background: var(--bg);
  padding-bottom: calc(var(--s10) + env(safe-area-inset-bottom));
}
@media (min-width: 560px) { .app { box-shadow: var(--shadow-md); } }

/* ─────────────────────────────────────────────
   3. 월 헤더
   ───────────────────────────────────────────── */
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  /* 홈화면 앱으로 열면 상단바가 겹치므로 그만큼 밀어준다 */
  padding: calc(var(--s6) + env(safe-area-inset-top)) var(--s5) var(--s4);
  gap: var(--s3);
}

.title { display: flex; align-items: center; gap: var(--s3); }
.title-text { display: flex; align-items: baseline; gap: var(--s2); }

/* 앱의 얼굴 — 홈화면 아이콘과 같은 모습이라 어느 앱인지 바로 읽힌다 */
.brand {
  flex: none;
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--accent);
}
.brand svg { width: 28px; height: 28px; }

/* 캐릭터 눈 깜빡임 — 가만히 있으면 그림이지만, 깜빡이면 살아 있는 느낌이 난다.
   여럿이 동시에 깜빡이면 기계 같아 보여서 자리마다 주기를 다르게 뒀다. */
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }

.eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: blink 5.4s infinite;
}
.daily-face   .eye { animation-duration: 6.4s; animation-delay: .9s; }
.install-face .eye { animation-duration: 4.6s; animation-delay: 1.7s; }
.cat          .eye { animation-duration: 7.2s; animation-delay: .4s; }
.empty        .eye { animation-duration: 4.2s; }

/* 빈 날의 캐릭터는 천천히 위아래로 */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.empty svg { animation: bob 3.4s ease-in-out infinite; }

.year  { font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.month { font-size: 27px; font-weight: 800; letter-spacing: -.02em; margin: 0; font-variant-numeric: tabular-nums; }

.nav { display: flex; align-items: center; gap: var(--s1); }

.nav-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  color: var(--ink-2);
  transition: background .15s ease;
}
.nav-btn:hover { background: var(--surface); }
.nav-btn svg { width: 18px; height: 18px; }

.today-btn {
  height: 34px;
  padding: 0 var(--s4);
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--shadow-sm);
  transition: transform .15s ease;
}
.today-btn:hover { transform: translateY(-1px); }
.today-btn[hidden] { display: none; }

/* ─────────────────────────────────────────────
   4. 월간 그리드
   ───────────────────────────────────────────── */
/* 달력이 이 앱의 주인공이다. 그림자와 여백을 다른 요소보다 확실히 키워
   화면에서 가장 먼저 눈에 들어오게 한다. */
.cal {
  margin: 0 var(--s4);
  padding: var(--s4) var(--s3) var(--s3);
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
}

.dow, .grid { display: grid; grid-template-columns: repeat(7, 1fr); }

.dow {
  padding-bottom: var(--s3);
  margin-bottom: var(--s2);
  border-bottom: 1.5px solid var(--line);
}
.dow span {
  text-align: center;
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: .06em;
  color: var(--muted);
}
.dow span:first-child { color: var(--sun); }
.dow span:last-child  { color: var(--sat); }

/* 달을 넘길 때 방향에 맞춰 살짝 밀린다 — 어디로 갔는지 알려주는 신호 */
@keyframes gridIn {
  from { opacity: 0; transform: translateX(var(--slide, 0)); }
}
.grid.anim { animation: gridIn .22s cubic-bezier(.2,.7,.3,1); }

.cell {
  position: relative;
  height: 78px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: var(--s1) 3px 0;
  border-radius: var(--r-md);
  overflow: hidden;
  transition: background .15s ease;
}
.cell:hover { background: var(--surface-2); }
.cell.out  { opacity: .32; }   /* 지난달·다음달 날짜 */

.num {
  display: grid;
  place-items: center;
  width: 26px; height: 26px;
  border-radius: var(--r-full);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
}
/* :not(.picked) 로 감싼 이유 — 고른 날은 노란 원에 짙은 글씨여야 하는데,
   요일 색 규칙이 더 구체적이라 그걸 덮어써 버렸다. */
.cell:not(.picked)[data-dow="0"] .num { color: var(--sun); }
.cell:not(.picked)[data-dow="6"] .num { color: var(--sat); }
.cell:not(.picked).holiday   .num { color: var(--sun); }

/* 오늘은 테두리, 고른 날은 채움.
   전에는 둘 다 노란 원이라 오늘을 고르면 무엇이 무엇인지 알 수 없었다. */
.cell.today  .num { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 800; }
.cell.picked .num { background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.cell.today.picked .num {
  box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--accent);
}

/* 날짜별 일정 요약 — 작은 막대에 제목까지 보여준다 */
.minis { width: 100%; display: flex; flex-direction: column; gap: 2px; }

.mini {
  height: 15px;
  padding: 0 4px;
  border-radius: 5px;
  background: color-mix(in oklab, var(--c) 34%, transparent);
  color: var(--ink);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 15px;
  text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mini.done { opacity: .42; text-decoration: line-through; }

/* 공휴일은 일정과 구분되게 빨간 계열로 */
.mini.holiday {
  background: color-mix(in oklab, var(--sun) 22%, transparent);
  color: var(--sun);
  font-weight: 800;
}

.more {
  padding-left: 4px;
  font-size: 10px;
  font-weight: 800;
  line-height: 11px;
  color: var(--muted);
  text-align: left;
}

/* ─────────────────────────────────────────────
   5. 오늘의 카드 — 달력 바로 아래 한 줄씩
   ───────────────────────────────────────────── */
.daily {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  margin: var(--s4) var(--s4) 0;
}
.daily[hidden] { display: none; }

/* 달력이 주인공이므로 이쪽은 한 단계 물러선다.
   흰 배경·그림자 대신 자기 색을 옅게 깔아 곁들임처럼 보이게 했다. */
.daily-card {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  padding: var(--s3);
  background: color-mix(in oklab, var(--c) 13%, var(--surface));
  border: 1.5px solid color-mix(in oklab, var(--c) 26%, transparent);
  border-radius: var(--r-md);
  text-align: left;
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.daily-card:hover {
  transform: translateY(-1px);
  background: color-mix(in oklab, var(--c) 20%, var(--surface));
  border-color: color-mix(in oklab, var(--c) 48%, transparent);
}
.daily-card:active { transform: translateY(0); }

.daily-face {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--surface);
}
.daily-face svg { width: 28px; height: 28px; }

.daily-body { flex: 1; min-width: 0; }
.daily-label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .05em;
  color: var(--c);
}
.daily-text {
  display: block;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.daily-go { flex: none; width: 16px; height: 16px; color: var(--muted); }

/* 카드를 누르면 열리는 팝업 안쪽 */
.detail {
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  max-height: 60svh;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.tagline {
  align-self: flex-start;
  padding: 3px var(--s3);
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--c) 22%, transparent);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--ink-2);
}

.detail h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  line-height: 1.42;
  letter-spacing: -.02em;
  text-wrap: balance;
}
.detail p { margin: 0; font-size: 15px; line-height: 1.75; color: var(--ink-2); }

.word-block { display: flex; flex-direction: column; gap: var(--s2); }

.word-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s3); }
.word { font-size: 30px; font-weight: 800; letter-spacing: -.025em; }
.pos  {
  padding: 2px var(--s2);
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--c) 24%, transparent);
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ink-2);
}

/* 발음기호와 한글 발음을 나란히 */
.word-sound { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s2); }
.ipa { font-size: 14px; font-weight: 500; color: var(--muted); }
.kr  { font-size: 14.5px; font-weight: 700; color: var(--c); letter-spacing: -.01em; }

.word-ko { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }

.ex-box {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  padding: var(--s4);
  background: var(--surface-2);
  border-radius: var(--r-md);
}
.ex-en { font-size: 15px; font-weight: 600; line-height: 1.5; }
.ex-ko { font-size: 13.5px; color: var(--ink-2); }

.tip { display: flex; gap: var(--s3); font-size: 13.5px; line-height: 1.65; color: var(--ink-2); }
.tip b { flex: none; color: var(--c); font-weight: 800; letter-spacing: .04em; }

/* ─────────────────────────────────────────────
   6. 날짜 팝업 안의 일정 목록
   ───────────────────────────────────────────── */
.day-title { display: flex; align-items: baseline; gap: var(--s2); min-width: 0; flex-wrap: wrap; }
.day-title h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.day-title h2.holiday { color: var(--sun); }
.day-title .count { font-size: 13px; color: var(--muted); font-weight: 600; flex: none; }

.holiday-tag {
  flex: none;
  padding: 2px var(--s2);
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--sun) 20%, transparent);
  color: var(--sun);
  font-size: 11.5px;
  font-weight: 800;
}

.events {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  max-height: 46svh;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin: 0 calc(var(--s1) * -1);
  padding: var(--s1);
}

.ev {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  padding: var(--s3) var(--s4) var(--s3) var(--s3);
  background: var(--surface);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
  text-align: left;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.ev:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: color-mix(in oklab, var(--c) 40%, transparent); }
.ev:active { transform: translateY(0); }

.ev-face {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: color-mix(in oklab, var(--c) 22%, transparent);
}
.ev-face svg { width: 28px; height: 28px; }

.ev-body { flex: 1; min-width: 0; }
.ev-time {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .03em;
  color: var(--c);
  font-variant-numeric: tabular-nums;
}
.ev-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ev-note {
  font-size: 12.5px;
  color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.ev.done { opacity: .55; }
.ev.done .ev-title { text-decoration: line-through; }

.check {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border: 2px solid var(--line);
  border-radius: var(--r-full);
  color: transparent;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.check:hover { border-color: var(--c); }
.check svg { width: 14px; height: 14px; }
.ev.done .check { background: var(--c); border-color: var(--c); color: #fff; }

/* 삭제 — 눌러도 곧바로 사라지지만 되돌릴 수 있다 */
.trash {
  flex: none;
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  color: var(--muted);
  transition: background .15s ease, color .15s ease;
}
.trash:hover { background: color-mix(in oklab, var(--danger) 16%, transparent); color: var(--danger); }
.trash svg { width: 15px; height: 15px; }

/* 되돌리기 알림 */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--s6) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: var(--s4);
  max-width: calc(100% - var(--s8));
  padding: var(--s3) var(--s3) var(--s3) var(--s5);
  border-radius: var(--r-full);
  background: var(--ink);
  color: var(--bg);
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  z-index: 60;
  animation: popUp .24s cubic-bezier(.2,.85,.3,1);
}
.toast[hidden] { display: none; }

.toast-undo {
  flex: none;
  height: 32px;
  padding: 0 var(--s4);
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13.5px;
  font-weight: 800;
}

/* 빈 날 */
.empty { padding: var(--s8) 0 var(--s6); text-align: center; }
.empty svg { width: 76px; height: 76px; opacity: .9; }
.empty p { margin: var(--s2) 0 0; font-size: 14px; color: var(--muted); font-weight: 500; }

.add-btn {
  width: 100%;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  border-radius: var(--r-md);
  border: 2px dashed var(--line);
  color: var(--ink-2);
  font-size: 14.5px;
  font-weight: 700;
  transition: border-color .15s ease, background .15s ease, color .15s ease;
}
.add-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.add-btn svg { width: 17px; height: 17px; }

/* ─────────────────────────────────────────────
   6-1. 설치 안내 막대

   크롬 메뉴에서 '앱 설치'를 찾기가 기기마다 달라 헷갈리므로
   앱 안에서 바로 설치할 수 있게 띄운다.
   ───────────────────────────────────────────── */
.install {
  position: fixed;
  left: 50%;
  bottom: calc(var(--s4) + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(428px, calc(100% - var(--s8)));
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3);
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  z-index: 20;
  animation: popUp .32s cubic-bezier(.2,.85,.3,1);
}
.install[hidden] { display: none; }

@keyframes popUp {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
}

/* 막대가 떠 있을 때 마지막 카드가 가려지지 않게 자리를 비운다 */
body.has-install .app { padding-bottom: 128px; }

.install-face {
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  background: var(--accent);
}
.install-face svg { width: 30px; height: 30px; }

.install-body { flex: 1; min-width: 0; }
.install-title { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
.install-desc {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.4;
}
.install-desc svg { width: 14px; height: 14px; flex: none; }

.install-btn {
  flex: none;
  height: 38px;
  padding: 0 var(--s4);
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 14px;
  font-weight: 800;
  transition: transform .15s ease;
}
.install-btn:hover { transform: translateY(-1px); }
.install-btn[hidden] { display: none; }

/* ─────────────────────────────────────────────
   7. 입력 시트
   ───────────────────────────────────────────── */
dialog.sheet {
  width: min(460px, 100%);
  max-width: 100%;
  margin: auto auto 0;
  padding: 0;
  border: none;
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  box-shadow: var(--shadow-lg);
}
@media (min-width: 560px) { dialog.sheet { margin: auto; border-radius: var(--r-xl); } }
dialog.sheet::backdrop { background: rgba(60,45,20,.4); backdrop-filter: blur(2px); }
dialog.sheet[open] { animation: rise .24s cubic-bezier(.2,.75,.3,1); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

.sheet-in {
  padding: var(--s5) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: var(--s4);
}

.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }

.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  color: var(--muted);
  transition: background .15s ease;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 17px; height: 17px; }

.field { display: flex; flex-direction: column; gap: var(--s2); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }

.input {
  width: 100%;
  height: 48px;
  padding: 0 var(--s4);
  background: var(--surface-2);
  border: 2px solid var(--line);
  border-radius: var(--r-md);
  transition: border-color .15s ease;
}
.input:focus { outline: none; border-color: var(--accent); }
.input:disabled { opacity: .45; }
textarea.input { height: auto; padding: var(--s3) var(--s4); resize: vertical; min-height: 48px; }

.row { display: flex; gap: var(--s3); }
.row > * { flex: 1; min-width: 0; }

/* 카테고리 고르기 — 캐릭터로 고른다 */
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); }

.cat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s1);
  padding: var(--s3) var(--s1);
  border: 2px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  transition: border-color .15s ease, background .15s ease, transform .15s ease;
}
.cat svg { width: 34px; height: 34px; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
.cat:hover svg { transform: translateY(-2px) scale(1.06); }
.cat[aria-pressed="true"] {
  border-color: var(--c);
  background: color-mix(in oklab, var(--c) 16%, transparent);
  color: var(--ink);
  font-weight: 700;
}

.toggle {
  display: flex; align-items: center; gap: var(--s2);
  font-size: 14px; color: var(--ink-2); cursor: pointer;
}
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

.actions { display: flex; gap: var(--s3); margin-top: var(--s1); }

.btn { height: 52px; border-radius: var(--r-md); font-size: 15px; font-weight: 700; transition: transform .15s ease, opacity .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { flex: 1; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm); }
.btn-ghost { padding: 0 var(--s5); background: var(--surface-2); border: 2px solid var(--line); color: var(--danger); }
.btn-ghost[hidden] { display: none; }
</style>
</head>
<body>

<div class="app">

  <header class="head">
    <div class="title">
      <span class="brand" id="brand"></span>
      <div class="title-text">
        <span class="year" id="year">2026년</span>
        <h1 class="month" id="monthLabel">8월</h1>
      </div>
    </div>
    <div class="nav">
      <button class="today-btn" id="todayBtn" hidden>오늘</button>
      <button class="nav-btn" id="prevBtn" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="nav-btn" id="nextBtn" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </header>

  <section class="cal">
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 일정 확인하러 온 김에 눈에 들어오도록 달력 바로 아래 둔다 -->
  <section class="daily" id="daily"></section>

</div>

<!-- 삭제 후 되돌리기 -->
<div class="toast" id="toast" hidden>
  <span id="toastText">일정을 삭제했어요</span>
  <button class="toast-undo" id="toastUndo">되돌리기</button>
</div>

<!-- 설치 안내 막대 (설치 가능할 때만 나타난다) -->
<div class="install" id="installBar" hidden>
  <span class="install-face" id="installFace"></span>
  <div class="install-body">
    <div class="install-title">홈 화면에 추가</div>
    <div class="install-desc" id="installDesc">주소창 없이 앱처럼 쓸 수 있어요</div>
  </div>
  <button class="install-btn" id="installBtn">설치</button>
  <button class="icon-btn" id="installClose" aria-label="나중에 하기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
</div>

<!-- 오늘의 상식 / 오늘의 단어 팝업 -->
<dialog class="sheet" id="dailySheet">
  <div class="sheet-in">
    <div class="sheet-head">
      <h2 id="dailyTitle">오늘의 상식</h2>
      <button type="button" class="icon-btn" id="dailyClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="detail" id="dailyBody"></div>
  </div>
</dialog>

<!-- 날짜를 누르면 뜨는 팝업 -->
<dialog class="sheet" id="daySheet">
  <div class="sheet-in">
    <div class="sheet-head">
      <div class="day-title">
        <h2 id="dayLabel">8월 13일 목요일</h2>
        <span class="holiday-tag" id="dayHoliday" hidden></span>
        <span class="count" id="dayCount"></span>
      </div>
      <button type="button" class="icon-btn" id="dayClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="events" id="events"></div>
    <button class="add-btn" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      일정 추가
    </button>
  </div>
</dialog>

<dialog class="sheet" id="sheet">
  <form class="sheet-in" id="form">
    <div class="sheet-head">
      <h2 id="sheetTitle">일정 추가</h2>
      <button type="button" class="icon-btn" id="closeBtn" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="field">
      <label class="label" for="fTitle">무엇을</label>
      <input class="input" id="fTitle" type="text" placeholder="예: 치과 예약" required maxlength="60" autocomplete="off">
    </div>

    <div class="field">
      <span class="label">어떤 일</span>
      <div class="cats" id="cats"></div>
    </div>

    <div class="row">
      <div class="field">
        <label class="label" for="fDate">날짜</label>
        <input class="input" id="fDate" type="date" required>
      </div>
      <div class="field">
        <label class="label" for="fTime">시각</label>

      <input type="checkbox" id="fAllday">
      시간 없이 하루 종일
    </label>

    <div class="field">
      <label class="label" for="fNote">메모 <span style="font-weight:400">(선택)</span></label>
      <textarea class="input" id="fNote" rows="2" placeholder="장소, 준비물 등" maxlength="200"></textarea>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-ghost" id="delBtn" hidden>삭제</button>
      <button type="submit" class="btn btn-primary">저장</button>
    </div>
  </form>
</dialog>

<!-- 콘텐츠는 앱 코드와 분리해 둔다. 상식·단어를 추가할 때 이 파일만 열면 된다.
     JSON이 아니라 .js 로 둔 이유: 파일을 그냥 더블클릭해서 열어도 동작하게 하려고. -->
<script src="data/knowledge.js"></script>
<script src="data/words.js"></script>
<script src="data/holidays.js"></script>

<script>
/* ─────────────────────────────────────────────
   캐릭터 4종 — 그림 파일 없이 SVG로 직접 그린다
   ───────────────────────────────────────────── */
const FACE = (extra = "") => `
  <circle class="eye" cx="15.5" cy="22" r="1.9" fill="#3B322A"/>
  <circle class="eye" cx="24.5" cy="22" r="1.9" fill="#3B322A"/>
  <path d="M17.4 26.4q2.6 2.2 5.2 0" stroke="#3B322A" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <ellipse cx="11" cy="25.2" rx="2.3" ry="1.5" fill="#E0736A" opacity=".3"/>
  <ellipse cx="29" cy="25.2" rx="2.3" ry="1.5" fill="#E0736A" opacity=".3"/>
  ${extra}`;

const ART = {
  /* 콩이 — 일상 */
  life: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <path d="M20 11c.4-4 3.6-6.2 6.4-6-.4 4-3 6.4-6.4 6z" fill="#9BD89B"/>
    <ellipse cx="20" cy="23" rx="12.5" ry="11.5" fill="${c}"/>${FACE()}</svg>`,

  /* 몽이 — 일·공부 */
  work: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <g fill="${c}">
      <circle cx="12" cy="25" r="7.5"/><circle cx="28" cy="25" r="7.5"/>
      <circle cx="20" cy="18.5" r="9.5"/><rect x="12" y="21" width="16" height="11.5" rx="5.5"/>
    </g>${FACE()}</svg>`,

  /* 복이 — 건강 */
  health: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <path d="M21 12.5c-.3-4 2.4-6.6 5.4-6.5-.6 3.9-2.2 6.2-5.4 6.5z" fill="#9BD89B"/>
    <circle cx="20" cy="23" r="12.2" fill="${c}"/>
    <path d="M20 11.5q1.6 5 0 9" stroke="#3B322A" stroke-width="1.1" opacity=".18" fill="none"/>${FACE()}</svg>`,

  /* 별이 — 특별한 날 */
  special: c => `<svg viewBox="0 0 40 40" aria-hidden="true">
    <path d="M20 7.5l3.9 8 8.8 1.2-6.4 6.2 1.5 8.7L20 27.5l-7.8 4.1 1.5-8.7-6.4-6.2 8.8-1.2z"
          fill="${c}" stroke="${c}" stroke-width="3.4" stroke-linejoin="round"/>${FACE()}</svg>`,
};

const CATS = [
  { id: "life",    name: "일상",  color: "#7BC47F" },
  { id: "work",    name: "일·공부", color: "#6EAEE0" },
  { id: "health",  name: "건강",  color: "#F49AB0" },
  { id: "special", name: "특별한 날", color: "#FFC93C" },
];

const catOf = id => CATS.find(c => c.id === id) || CATS[0];
const art   = id => ART[catOf(id).id](catOf(id).color);

/* ─────────────────────────────────────────────
   저장 — 이 브라우저에만 저장한다 (개인용)
   ───────────────────────────────────────────── */
const KEY = "mallang-cal:events";

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
const save = () => localStorage.setItem(KEY, JSON.stringify(events));

/* 날짜를 YYYY-MM-DD 로 (시간대 오차를 피하려고 직접 만든다) */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const TODAY = ymd(new Date());

function seed() {
  const base = new Date();
  const day = n => { const d = new Date(base); d.setDate(d.getDate()+n); return ymd(d); };
  return [
    { id:"s1", date:day(0),  time:"08:30", title:"모닝 스트레칭",   cat:"health",  note:"15분",         done:true  },
    { id:"s2", date:day(0),  time:"14:00", title:"팀 회의",         cat:"work",    note:"3층 회의실",    done:false },
    { id:"s3", date:day(0),  time:"",      title:"장보기",           cat:"life",    note:"우유, 계란",    done:false },
    { id:"s4", date:day(2),  time:"19:00", title:"영화 보기",        cat:"life",    note:"",             done:false },
    { id:"s5", date:day(3),  time:"10:00", title:"치과 정기검진",    cat:"health",  note:"연세치과 3층",  done:false },
    { id:"s6", date:day(5),  time:"",      title:"엄마 생신",        cat:"special", note:"선물 준비!",    done:false },
    { id:"s7", date:day(-2), time:"09:00", title:"자격증 원서 접수", cat:"work",    note:"",             done:true  },
  ];
}

let events  = load() ?? seed();
let picked  = TODAY;                                  // 선택한 날짜
let view    = { y: +TODAY.slice(0,4), m: +TODAY.slice(5,7) };  // 보고 있는 달
let editing = null;

/* ─────────────────────────────────────────────
   화면 그리기
   ───────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const WD = ["일","월","화","수","목","금","토"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const eventsOn = date => events
  .filter(e => e.date === date)
  .sort((a,b) => (a.time || "").localeCompare(b.time || ""));

/* 공휴일 조회 — 없으면 null.
   양력 고정 공휴일은 모든 연도에서, 음력·대체공휴일은 표에 있는 해에만 잡힌다. */
function holidayOn(date) {
  if (typeof HOLIDAYS_FIXED === "undefined") return null;

  const year = date.slice(0, 4);
  const md   = date.slice(5);

  const fixed = HOLIDAYS_FIXED.find(([d]) => d === md);
  if (fixed) return fixed[1];

  const listed = (HOLIDAYS_BY_YEAR?.[year] || []).find(([d]) => d === md);
  return listed ? listed[1] : null;
}

function renderMonth() {
  $("year").textContent       = `${view.y}년`;
  $("monthLabel").textContent = `${view.m}월`;
  $("todayBtn").hidden        = view.y === +TODAY.slice(0,4) && view.m === +TODAY.slice(5,7);

  const lead = new Date(view.y, view.m - 1, 1).getDay();  // 1일 앞의 칸 수

  /* 항상 6줄(42칸)로 그린다.
     달마다 5줄·6줄로 달라지면 아래에 있는 오늘의 카드가 위아래로 튄다. */
  let html = "";
  for (let i = 0; i < 42; i++) {
    const d    = new Date(view.y, view.m - 1, 1 - lead + i);
    const date = ymd(d);
    const out  = d.getMonth() !== view.m - 1;           // 지난달·다음달
    const list = eventsOn(date);

    /* 칸이 좁다. 공휴일이 있으면 그것부터 보여주고 남는 자리에 일정을 넣는다 */
    const holiday = holidayOn(date);
    const room    = holiday ? 1 : 2;
    const rest    = list.length - room;

    const minis =
      (holiday ? `<span class="mini holiday">${esc(holiday)}</span>` : "") +
      list.slice(0, room)
        .map(e => `<span class="mini${e.done ? " done" : ""}" style="--c:${catOf(e.cat).color}">${esc(e.title)}</span>`)
        .join("") +
      (rest > 0 ? `<span class="more">+${rest}</span>` : "");

    html += `<button class="cell${out ? " out" : ""}${date === TODAY ? " today" : ""}${date === picked ? " picked" : ""}${holiday ? " holiday" : ""}"
                     data-date="${date}" data-dow="${i % 7}"
                     aria-label="${d.getMonth() + 1}월 ${d.getDate()}일${holiday ? " " + holiday : ""}, 일정 ${list.length}개">
               <span class="num">${d.getDate()}</span>
               <span class="minis">${minis}</span>
             </button>`;
  }
  $("grid").innerHTML = html;
}

/* 날짜 팝업 안쪽을 다시 그린다 */
function renderDaySheet() {
  const [y, m, d] = picked.split("-").map(Number);
  const w = new Date(y, m - 1, d).getDay();
  const list = eventsOn(picked);

  const holiday = holidayOn(picked);

  $("dayLabel").textContent = `${m}월 ${d}일 ${WD[w]}요일`;
  $("dayLabel").className   = holiday || w === 0 ? "holiday" : "";
  $("dayHoliday").textContent = holiday || "";
  $("dayHoliday").hidden      = !holiday;
  $("dayCount").textContent = list.length ? `${list.length}개` : "";

  if (!list.length) {
    $("events").innerHTML = `
      <div class="empty">${ART.life("#D8CDB4")}
        <p>아직 일정이 없어요</p>
      </div>`;
    return;
  }

  $("events").innerHTML = list.map(e => {
    const c = catOf(e.cat);
    return `
      <div class="ev${e.done ? " done" : ""}" style="--c:${c.color}">
        <span class="ev-face">${art(e.cat)}</span>
        <button class="ev-body" data-edit="${e.id}">
          <span class="ev-time">${e.time || "하루 종일"}</span>
          <div class="ev-title">${esc(e.title)}</div>
          ${e.note ? `<div class="ev-note">${esc(e.note)}</div>` : ""}
        </button>
        <button class="check" data-toggle="${e.id}" aria-label="완료 표시"
                aria-pressed="${e.done}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
        <button class="trash" data-del="${e.id}" aria-label="삭제">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 002 2h6a2 2 0 002-2l1-14"/>
          </svg>
        </button>
      </div>`;
  }).join("");
}

/* 팝업이 열려 있을 때만 그 안쪽도 같이 갱신한다 */
const render = () => {
  renderMonth();
  if ($("daySheet").open) renderDaySheet();
};

/* 날짜를 눌렀을 때 — 팝업을 띄운다 */
function openDay(date) {
  picked = date;

  /* 지난달·다음달 날짜를 눌렀으면 그 달로 넘어간다 */
  const y = +date.slice(0, 4), m = +date.slice(5, 7);
  if (y !== view.y || m !== view.m) view = { y, m };

  renderMonth();
  renderDaySheet();
  if (!$("daySheet").open) $("daySheet").showModal();
}

/* ─────────────────────────────────────────────
   입력 시트
   ───────────────────────────────────────────── */
let pickedCat = "life";

function renderCats() {
  $("cats").innerHTML = CATS.map(c => `
    <button type="button" class="cat" data-cat="${c.id}" style="--c:${c.color}"
            aria-pressed="${c.id === pickedCat}">
      ${ART[c.id](c.color)}${esc(c.name)}
    </button>`).join("");
}

function openSheet(id) {
  editing = id ?? null;
  const e = id ? events.find(v => v.id === id) : null;

  $("sheetTitle").textContent = e ? "일정 수정" : "일정 추가";
  $("fTitle").value    = e?.title ?? "";
  $("fDate").value     = e?.date  ?? picked;
  $("fTime").value     = e?.time  ?? "";
  $("fNote").value     = e?.note  ?? "";
  $("fAllday").checked = e ? !e.time : false;
  $("fTime").disabled  = $("fAllday").checked;
  $("delBtn").hidden   = !e;
  pickedCat = e?.cat ?? "life";

  renderCats();
  $("sheet").showModal();
  if (!e) setTimeout(() => $("fTitle").focus(), 80);
}

/* ─────────────────────────────────────────────
   조작 연결
   ───────────────────────────────────────────── */
function shiftMonth(n) {
  const d = new Date(view.y, view.m - 1 + n, 1);
  view = { y: d.getFullYear(), m: d.getMonth() + 1 };
  renderMonth();

  /* 넘어간 방향으로 살짝 밀어준다 — 순간이동하면 어디로 갔는지 알기 어렵다 */
  const g = $("grid");
  g.style.setProperty("--slide", n > 0 ? "16px" : "-16px");
  g.classList.remove("anim");
  void g.offsetWidth;                    // 애니메이션을 다시 시작시키는 장치
  g.classList.add("anim");
}

$("prevBtn").onclick  = () => shiftMonth(-1);
$("nextBtn").onclick  = () => shiftMonth(1);
$("todayBtn").onclick = () => {
  view   = { y: +TODAY.slice(0,4), m: +TODAY.slice(5,7) };
  picked = TODAY;
  render();
};

/* 날짜를 누르면 그 날의 팝업이 뜬다 */
$("grid").onclick = ev => {
  const cell = ev.target.closest(".cell[data-date]");
  if (!cell) return;
  openDay(cell.dataset.date);
};

$("dayClose").onclick = () => $("daySheet").close();

/* ─────────────────────────────────────────────
   삭제 — 확인 창으로 막지 않고, 지운 뒤 되돌릴 수 있게 한다.
   묻고 답하는 것보다 실수했을 때 한 번에 되돌리는 쪽이 덜 번거롭다.
   ───────────────────────────────────────────── */
let undoItem = null, undoTimer = null;

function removeEvent(id) {
  const i = events.findIndex(v => v.id === id);
  if (i < 0) return;

  undoItem = { event: events[i], at: i };
  events.splice(i, 1);
  save();
  render();

  $("toastText").textContent = `'${undoItem.event.title}' 삭제됨`;
  $("toast").hidden = false;

  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { $("toast").hidden = true; undoItem = null; }, 6000);
}

$("toastUndo").onclick = () => {
  if (!undoItem) return;
  events.splice(undoItem.at, 0, undoItem.event);   // 있던 자리에 그대로 되돌린다
  save();
  undoItem = null;
  clearTimeout(undoTimer);
  $("toast").hidden = true;
  render();
};

$("events").onclick = ev => {
  const del = ev.target.closest("[data-del]");
  if (del) return removeEvent(del.dataset.del);

  const toggle = ev.target.closest("[data-toggle]");
  if (toggle) {
    const e = events.find(v => v.id === toggle.dataset.toggle);
    if (e) { e.done = !e.done; save(); render(); }
    return;
  }

  const edit = ev.target.closest("[data-edit]");
  if (edit) openSheet(edit.dataset.edit);
};

$("addBtn").onclick   = () => openSheet();
$("closeBtn").onclick = () => $("sheet").close();

$("cats").onclick = ev => {
  const btn = ev.target.closest(".cat");
  if (!btn) return;
  pickedCat = btn.dataset.cat;
  renderCats();
};

$("fAllday").onchange = ev => {
  $("fTime").disabled = ev.target.checked;
  if (ev.target.checked) $("fTime").value = "";
};

$("delBtn").onclick = () => {
  events = events.filter(v => v.id !== editing);
  save();
  $("sheet").close();
  render();
};

$("form").onsubmit = ev => {
  ev.preventDefault();

  const data = {
    title: $("fTitle").value.trim(),
    date:  $("fDate").value,
    time:  $("fAllday").checked ? "" : $("fTime").value,
    note:  $("fNote").value.trim(),
    cat:   pickedCat,
  };
  if (!data.title || !data.date) return;

  if (editing) {
    Object.assign(events.find(v => v.id === editing), data);
  } else {
    events.push({ id: String(Date.now()), done: false, ...data });
  }

  save();
  picked = data.date;                                   // 저장한 날로 이동
  view   = { y: +data.date.slice(0,4), m: +data.date.slice(5,7) };
  $("sheet").close();
  render();
};

/* ─────────────────────────────────────────────
   오늘의 상식 / 오늘의 단어

   날짜로 순서를 정한다. 무작위로 뽑으면 새로고침할 때마다
   내용이 바뀌어서 '오늘의'라는 말이 무의미해지기 때문이다.
   ───────────────────────────────────────────── */
const DAILY = {
  knowledge: { label: "오늘의 상식", color: "#A98BD4", shape: "special" },
  word:      { label: "오늘의 단어", color: "#4FB3AC", shape: "work"    },
};

/* 올해 며칠째인가 (1월 1일이 0) */
function dayOfYear(d = new Date()) {
  return Math.floor((d - new Date(d.getFullYear(), 0, 1)) / 86400000);
}

const pickToday = list => list[dayOfYear() % list.length];

const CHEVRON = `<svg class="daily-go" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;

function dailyCard(kind, text) {
  const d = DAILY[kind];
  return `
    <button class="daily-card" data-daily="${kind}" style="--c:${d.color}">
      <span class="daily-face">${ART[d.shape](d.color)}</span>
      <span class="daily-body">
        <span class="daily-label">${d.label}</span>
        <span class="daily-text">${esc(text)}</span>
      </span>
      ${CHEVRON}
    </button>`;
}

function renderDaily() {
  const k = pickToday(KNOWLEDGE);
  const w = pickToday(WORDS);
  /* 카드는 한 줄뿐이라 뜻은 첫 번째 것만 보여준다 */
  $("daily").innerHTML =
    dailyCard("knowledge", k.q) +
    dailyCard("word", `${w.word}${w.kr ? ` [${w.kr}]` : ""} · ${w.ko.split(",")[0]}`);
}

function openDaily(kind) {
  const d = DAILY[kind];
  $("dailyTitle").textContent = d.label;
  $("dailyBody").style.setProperty("--c", d.color);

  if (kind === "knowledge") {
    const k = pickToday(KNOWLEDGE);
    $("dailyBody").innerHTML = `
      <span class="tagline">${esc(k.tag)}</span>
      <h3>${esc(k.q)}</h3>
      <p>${esc(k.a)}</p>`;
  } else {
    const w = pickToday(WORDS);
    $("dailyBody").innerHTML = `
      <div class="word-block">
        <div class="word-head">
          <span class="word">${esc(w.word)}</span>
          <span class="pos">${esc(w.pos)}</span>
        </div>
        <div class="word-sound">
          <span class="ipa">${esc(w.ipa)}</span>
          ${w.kr ? `<span class="kr">[${esc(w.kr)}]</span>` : ""}
        </div>
        <div class="word-ko">${esc(w.ko)}</div>
      </div>
      <div class="ex-box">
        <div class="ex-en">${esc(w.ex)}</div>
        <div class="ex-ko">${esc(w.exKo)}</div>
      </div>
      ${w.tip ? `<div class="tip"><b>TIP</b><span>${esc(w.tip)}</span></div>` : ""}`;
  }
  $("dailySheet").showModal();
}

$("daily").onclick = ev => {
  const card = ev.target.closest("[data-daily]");
  if (card) openDaily(card.dataset.daily);
};
$("dailyClose").onclick = () => $("dailySheet").close();

/* 콘텐츠 파일을 못 읽었으면 카드를 아예 감춘다 */
if (typeof KNOWLEDGE !== "undefined" && typeof WORDS !== "undefined"
    && KNOWLEDGE.length && WORDS.length) {
  renderDaily();
} else {
  $("daily").hidden = true;
}

/* 헤더의 앱 얼굴 — 홈화면 아이콘과 같은 모습 */
$("brand").innerHTML = ART.life("#FFFFFF");

render();

/* ─────────────────────────────────────────────
   홈 화면에 추가 안내

   안드로이드(크롬)는 브라우저가 '설치해도 된다'고 알려주면
   그 순간을 붙잡아 두었다가 버튼을 눌렀을 때 설치창을 띄운다.
   아이폰은 애플이 이 기능을 막아두어서 안내 문구만 보여준다.
   ───────────────────────────────────────────── */
const INSTALL_KEY = "mallang-cal:install-hidden-until";

/* 이미 홈 화면 앱으로 열려 있는가 */
const isInstalled = () =>
  matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

const isIOS = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);  // 아이패드

/* 닫기를 누르면 일주일 동안 다시 뜨지 않는다 */
const snoozed = () => Number(localStorage.getItem(INSTALL_KEY) || 0) > Date.now();

let deferredPrompt = null;

const SHARE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/></svg>`;

/* mode
   "prompt" 크롬이 설치해도 된다고 알려온 경우 — 버튼 한 번으로 끝난다
   "ios"    아이폰 — 애플이 막아두어 공유 메뉴로 안내한다
   "manual" 신호가 오지 않은 경우 — 메뉴 위치를 알려준다 */
function showInstall(mode) {
  if (isInstalled() || snoozed() || !$("installBar").hidden) return;

  $("installFace").innerHTML = ART.life("#FFFFFF");
  $("installBtn").hidden = mode !== "prompt";

  if (mode === "ios") {
    $("installDesc").innerHTML = `${SHARE_ICON} 공유 버튼 → '홈 화면에 추가'`;
  } else if (mode === "manual") {
    $("installDesc").textContent = "브라우저 메뉴 ⋮ → '앱 설치'";
  }

  $("installBar").hidden = false;
  document.body.classList.add("has-install");
}

function hideInstall(snoozeDays = 0) {
  $("installBar").hidden = true;
  document.body.classList.remove("has-install");
  if (snoozeDays) {
    localStorage.setItem(INSTALL_KEY, String(Date.now() + snoozeDays * 864e5));
  }
}

/* 크롬이 '설치 가능'을 알려주는 순간 — 기본 안내를 막고 우리 막대를 띄운다 */
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstall("prompt");
});

$("installBtn").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;      // 설치했든 취소했든 이 창은 한 번만 쓸 수 있다
  deferredPrompt = null;
  hideInstall();
};

$("installClose").onclick = () => hideInstall(7);

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  hideInstall();
});

/* 신호를 기다리되, 오지 않아도 안내는 뜨게 한다.
   브라우저마다 신호를 보내는 조건이 달라서, 신호에만 기대면
   아무것도 안 보이는 상태가 되어버린다. */
setTimeout(() => {
  if (isInstalled()) return;
  showInstall(isIOS() ? "ios" : "manual");
}, 2500);

/* ─────────────────────────────────────────────
   서비스 워커 — 인터넷이 끊겨도 앱이 열리게 한다.

   여기에 자동 갱신도 함께 붙였다.
   앱을 고쳐서 올려도 폰은 저장해 둔 옛 화면을 계속 쓰기 때문에,
   사용자가 직접 새로고침하지 않으면 새 버전을 볼 수 없었다.
   이제 앱을 열거나 다시 켤 때 스스로 확인하고 조용히 갈아끼운다.
   ───────────────────────────────────────────── */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {

  /* 처음 방문이라 서비스 워커가 막 붙는 것은 '갱신'이 아니다.
     이걸 구분하지 않으면 첫 방문 때 쓸데없이 한 번 새로고침된다. */
  const hadController = !!navigator.serviceWorker.controller;

  let registration = null;
  let updateReady  = false;
  let reloading    = false;

  /* 일정을 쓰는 도중에 새로고침되면 입력하던 내용이 날아간다.
     창이 열려 있으면 미뤘다가 닫은 뒤에 적용한다. */
  const isBusy = () => [...document.querySelectorAll("dialog")].some(d => d.open);

  function applyUpdate() {
    if (!updateReady || reloading || isBusy()) return;
    reloading = true;
    location.reload();
  }

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return;
    updateReady = true;
    applyUpdate();
  });

  /* 창을 닫는 순간이 갈아끼우기 가장 좋은 때다 */
  document.querySelectorAll("dialog").forEach(d =>
    d.addEventListener("close", () => setTimeout(applyUpdate, 200)));

  /* 앱을 다시 켤 때마다 새 버전이 있는지 확인한다 */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") registration?.update().catch(() => {});
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => { registration = reg; })
      .catch(() => {});
  });
}
</script>

</body>
</html>

const WX_PARTS = [["아침","09:00"], ["낮","15:00"], ["저녁","19:00"], ["밤","22:00", true]];

/* 목록에서 '내일' 이라고 적을 날짜. 요일보다 이 말이 빨리 읽힌다 */
const WX_TOMORROW = (() => {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return ymd(d);
})();

async function wxFetch() {
  const url = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${WX_PLACE.lat}&longitude=${WX_PLACE.lon}`
    + "&current=weather_code,temperature_2m"
    + "&hourly=weather_code,temperature_2m"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    + "&timezone=Asia%2FSeoul&forecast_days=7";

  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`날씨 응답이 ${res.status} 입니다`);

  const j = await res.json();
  const D = j.daily;
  if (!D?.time?.length) throw new Error("예보가 비어 있습니다");

  const H = j.hourly || {};

  /* 하루를 오전(00~11)·오후(12~23)로 갈라 각각 그 반나절에 가장 심했던 날씨를 낸다.

     일별 코드 하나만 쓰면 오후에 잠깐 친 천둥 때문에 하루 종일 천둥번개로
     표시된다. 실제로는 오전엔 이슬비만 오는 날인데도 그렇다.
     일주일에 번개가 사흘 뜨면 예보를 믿지 않게 되고, 정작 진짜 뇌우 날의
     경고가 묻힌다. 반나절씩 나누면 그런 일이 없다. */
  const halfCode = (date, from, to) => {
    let worst = null;
    (H.time || []).forEach((t, i) => {
      if (!t.startsWith(date)) return;
      const h = +t.slice(11, 13);
      if (h < from || h > to) return;
      const c = H.weather_code[i];
      if (Number.isFinite(c) && (worst === null || c > worst)) worst = c;
    });
    return worst;
  };

  const days = D.time.map((date, i) => ({
    date,
    code: D.weather_code[i],
    am:   halfCode(date, 0, 11),
    pm:   halfCode(date, 12, 23),
    max:  Math.round(D.temperature_2m_max[i]),
    min:  Math.round(D.temperature_2m_min[i]),
    pop:  D.precipitation_probability_max[i] ?? 0,
  })).filter(d => Number.isFinite(d.max) && Number.isFinite(d.min));

  if (!days.length) throw new Error("쓸 만한 예보가 없습니다");

  /* 오늘 하루의 네 토막. 이미 지난 시간대도 그대로 두는 편이 낫다.
     저녁에 열었을 때 '아침엔 맑았지' 하고 하루를 되짚게 된다 */
  const parts = WX_PARTS.map(([label, hm, night]) => {
    const i = (H.time || []).indexOf(`${TODAY}T${hm}`);
    return i < 0 ? null
      : { label, night: !!night, code: H.weather_code[i], temp: Math.round(H.temperature_2m[i]) };
  }).filter(p => p && Number.isFinite(p.temp));

  return {
    at:    Date.now(),
    place: WX_PLACE.name,
    days,
    parts,
    partsDate: TODAY,
    now: j.current && Number.isFinite(j.current.temperature_2m)
      ? { code: j.current.weather_code, temp: Math.round(j.current.temperature_2m) }
      : null,
  };
}

async function wxRefresh() {
  if (wxBusy) return;
  wxBusy = true;
  wxPaintSheet();                       // 팝업이 열려 있으면 '가져오는 중' 으로 바뀐다
  try {
    wx = await wxFetch();
    try { localStorage.setItem(WX_KEY, JSON.stringify(wx)); } catch {}
  } catch {
    /* 못 받아왔으면 저장해 둔 것을 그대로 쓴다. 그것마저 없을 때만 실패 화면이 뜬다 */
  }
  wxBusy = false;
  wxPaintBtn();
  wxPaintSheet();
}

/* 밤 8시부터 새벽 6시까지는 해 대신 달을 그린다 */
const wxIsNight = () => { const h = new Date().getHours(); return h >= 20 || h < 6; };

const wxStale = () => !wx || Date.now() - wx.at > WX_TTL;
const wxToday = () => wx?.days.find(d => d.date === TODAY) || null;

/* ── 헤더 버튼 ── */
function wxPaintBtn() {
  const btn = $("wxBtn");
  const today = wxToday();
  if (!today) { btn.hidden = true; return; }

  /* 지금 하늘이 어떤지가 그날의 대표 날씨보다 궁금하다. 있으면 현재값을 쓴다 */
  const code = wx.now ? wx.now.code : today.code;
  const temp = wx.now ? wx.now.temp : today.max;

  /* 강아지 얼굴을 동그랗게 잘라 넣고, 오른쪽 아래에 날씨 배지를 붙인다.
     사진만 넣으면 34px 안에서 흰 강아지가 흰 덩어리가 되어 무슨 날씨인지
     알 수 없다. 배지가 그것을 대신 말해 준다. */
  const photo = wxPhoto(code, wxIsNight());
  btn.innerHTML =
    `<img src="${photo.src}" alt="" style="object-position:${photo.face}" onerror="this.remove()">` +
    `<span class="wx-btn-badge">${WX_ART[wxKind(code, wxIsNight())]()}</span>`;
  btn.setAttribute("aria-label", `${WX_PLACE.name} 날씨 ${wxText(code)} ${temp}도, 주간 예보 보기`);
  btn.hidden = false;
}

/* ── 팝업 ── */

/* 막대의 왼쪽 끝과 오른쪽 끝을 한 주의 최저~최고 안에서의 위치로 잡는다.
   그래야 일곱 줄을 위아래로 훑을 때 어느 날이 더운지 바로 보인다 */
function wxBar(d, lo, hi) {
  const span = Math.max(1, hi - lo);
  let l = (d.min - lo) / span * 100;
  let r = (hi - d.max) / span * 100;

  /* 하루 안 기온 차가 거의 없는 날은 막대가 실처럼 가늘어져 안 보인다 */
  if (100 - l - r < 12) {
    const mid = (l + (100 - r)) / 2;
    l = Math.max(0, mid - 6);
    r = Math.max(0, 100 - mid - 6);
  }
  return `<i style="left:${l.toFixed(1)}%;right:${r.toFixed(1)}%;
            background:linear-gradient(90deg,${wxColor(d.min)},${wxColor(d.max)})"></i>`;
}

function wxDayRow(d, lo, hi) {
  const [y, m, dd] = d.date.split("-").map(Number);
  const w    = new Date(y, m - 1, dd).getDay();
  const holi = holidayOn(d.date);

  const when = d.date === WX_TOMORROW ? "내일" : `${WD[w]} <small>${dd}</small>`;

  const dots = eventsOn(d.date).slice(0, 4)
    .map(e => `<span style="--c:${catOf(e.cat).color}"></span>`).join("");

  /* 시간별 예보를 못 받은 경우에는 하루 대표 날씨를 양쪽에 똑같이 쓴다 */
  const am = d.am ?? d.code;
  const pm = d.pm ?? d.code;

  return `
    <button class="wx-day" data-wxdate="${d.date}"
            aria-label="${m}월 ${dd}일, 오전 ${wxText(am)}, 오후 ${wxText(pm)}, 최저 ${d.min}도 최고 ${d.max}도">
      <span class="wx-when${holi || w === 0 ? " sun" : w === 6 ? " sat" : ""}">${when}</span>
      ${WX_ART[wxKind(am)]()}
      ${WX_ART[wxKind(pm)]()}
      <span class="wx-pop">${d.pop >= 20 ? d.pop + "%" : ""}</span>
      <span class="wx-range">
        <span class="wx-lo">${d.min}°</span>
        <span class="wx-bar">${wxBar(d, lo, hi)}</span>
        <span class="wx-hi">${d.max}°</span>
      </span>
      <span class="wx-dots">${dots}</span>
    </button>`;
}

function wxPaintSheet() {
  if (!$("wxSheet").open) return;
  const box = $("wxBody");

  if (!wx) {
    box.innerHTML = wxBusy
      ? `<div class="wx-msg">${ART.life("#D8CDB4")}<p>하늘을 살펴보는 중이에요</p></div>`
      : `<div class="wx-msg">${ART.life("#D8CDB4")}
           <p>날씨를 가져오지 못했어요.<br>인터넷 연결을 확인해 주세요.</p>
           <div class="detail-actions" style="--c:#6EAEE0">
             <button type="button" class="shuffle" id="wxRetry">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                 <path d="M21 12a9 9 0 11-2.6-6.4M21 3v6h-6"/>
               </svg>
               다시 시도
             </button>
           </div>
         </div>`;
    if (!wxBusy) $("wxRetry").onclick = wxRefresh;
    return;
  }

  const today = wxToday();
  const rest  = wx.days.filter(d => d.date > TODAY);

  /* 막대의 눈금은 오늘까지 넣어서 잡는다. 오늘만 유난히 덥던 주에
     내일부터의 막대가 통째로 왼쪽에 몰리는 것을 막는다 */
  const scale = today ? [today, ...rest] : rest;
  const lo = Math.min(...scale.map(d => d.min));
  const hi = Math.max(...scale.map(d => d.max));

  const code = wx.now ? wx.now.code : today.code;
  const temp = wx.now ? wx.now.temp : today.max;
  const photo = wxPhoto(code, wxIsNight());

  const parts = wx.partsDate === TODAY && wx.parts.length
    ? `<div class="wx-parts">${wx.parts.map(p => `
         <div class="wx-part">
           <span class="wx-part-when">${p.label}</span>
           ${WX_ART[wxKind(p.code, p.night)]()}
           <span class="wx-part-temp">${p.temp}°</span>
         </div>`).join("")}</div>`
    : "";

  const stamp = new Date(wx.at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });

  box.innerHTML = `
    ${wxCalTab()}
    ${wxEdgeStickers()}
    <div class="wx">
      <div class="wx-now">
        <span class="wx-photo${photo.dark ? " is-dark" : ""}">
          <img src="${photo.src}" alt="" onerror="this.remove()">
          <span class="wx-photo-alt">${WX_ART[wxKind(code, wxIsNight())](true)}</span>
        </span>
        <span class="wx-now-temp">${temp}°</span>
        <span class="wx-now-desc">${wxText(code)}</span>
        ${today ? `<span class="wx-now-sub">최고 ${today.max}° · 최저 ${today.min}°${
          today.pop >= 20 ? ` · 비 올 확률 ${today.pop}%` : ""}</span>` : ""}
        ${parts}
        ${wxStickers()}
      </div>
      <div class="wx-days">
        <div class="wx-days-head" aria-hidden="true"><span></span><span>오전</span><span>오후</span></div>
        ${rest.map(d => wxDayRow(d, lo, hi)).join("")}
      </div>
      <div class="wx-foot">
        <span><b>${esc(wx.place)}</b> · ${stamp} 기준</span>
        <span>Open-Meteo</span>
      </div>
    </div>`;
}

function openWeather() {
  $("wxSheet").showModal();
  wxPaintSheet();
  if (wxStale()) wxRefresh();
}

$("wxBtn").onclick   = openWeather;
$("wxClose").onclick = () => $("wxSheet").close();

/* 날짜 줄을 누르면 그 날 일정으로 넘어간다.
   '금요일에 비가 오네' 다음에 오는 생각은 '그날 약속 있었나' 다 */
$("wxBody").addEventListener("click", ev => {
  const row = ev.target.closest("[data-wxdate]");
  if (!row) return;
  $("wxSheet").close();
  openDay(row.dataset.wxdate);
});

/* 앱이 뜨는 순간에는 달력이 먼저다. 날씨는 한 박자 늦게 조용히 받아온다.
   저장해 둔 것이 있으면 그것부터 띄워 두므로 기다림이 보이지 않는다 */
wx = wxLoad();
wxPaintBtn();
setTimeout(() => { if (wxStale()) wxRefresh(); }, wx ? 1500 : 700);

/* 앱을 다시 켤 때 한 시간이 지났으면 새로 받는다 */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && wxStale()) wxRefresh();
});

/* ─────────────────────────────────────────────
   서비스 워커 — 인터넷이 끊겨도 앱이 열리게 한다.

   여기에 자동 갱신도 함께 붙였다.
   앱을 고쳐서 올려도 폰은 저장해 둔 옛 화면을 계속 쓰기 때문에,
   사용자가 직접 새로고침하지 않으면 새 버전을 볼 수 없었다.
   이제 앱을 열거나 다시 켤 때 스스로 확인하고 조용히 갈아끼운다.
   ───────────────────────────────────────────── */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {

  /* 처음 방문이라 서비스 워커가 막 붙는 것은 '갱신'이 아니다.
     이걸 구분하지 않으면 첫 방문 때 쓸데없이 한 번 새로고침된다. */
  const hadController = !!navigator.serviceWorker.controller;

  let registration = null;
  let updateReady  = false;
  let reloading    = false;

  /* 일정을 쓰는 도중에 새로고침되면 입력하던 내용이 날아간다.
     창이 열려 있으면 미뤘다가 닫은 뒤에 적용한다. */
  const isBusy = () => [...document.querySelectorAll("dialog")].some(d => d.open);

  function applyUpdate() {
    if (!updateReady || reloading || isBusy()) return;
    reloading = true;
    location.reload();
  }

  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return;
    updateReady = true;
    applyUpdate();
  });

  /* 창을 닫는 순간이 갈아끼우기 가장 좋은 때다 */
  document.querySelectorAll("dialog").forEach(d =>
    d.addEventListener("close", () => setTimeout(applyUpdate, 200)));

  /* 앱을 다시 켤 때마다 새 버전이 있는지 확인한다 */
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") registration?.update().catch(() => {});
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => { registration = reg; })
      .catch(() => {});
  });
}
</script>
